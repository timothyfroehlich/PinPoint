# PinPoint project toolchain contract.
#
# package.json#packageManager remains the single authority for the exact pnpm
# version and its integrity hash. Mise 2026.8.11+ reads that declaration directly
# via idiomatic_version_file_enable_tools without duplicating the pnpm version here.
#
# Minimum mise version: 2026.8.11 (verifies packageManager sha512 checksums).
min_version = "2026.8.11"

# pnpm 12 ships as a native binary; the npm registry package for it is just a
# postinstall stub that fetches the real binary, and mise's npm: backend does
# not run npm lifecycle scripts. aqua:pnpm/pnpm downloads the prebuilt binary
# directly. CI's mise-action invokes `mise install --locked node pnpm`, naming
# pnpm as an explicit CLI argument — that resolves through mise's registry
# default backend for the bare name and skips whatever backend mise.lock has
# recorded for the idiomatically-detected tool (PP-fmnm). This alias pins the
# backend so both the explicit-argument and project-aware resolution paths
# agree; the version still comes from packageManager, never duplicated here.
[tool_alias]
pnpm = "aqua:pnpm/pnpm"

[tools]
node = "24.20.0"
python = "3.14.7"
ruff = "0.16.6"
zizmor = "1.29.0"
# Supabase CLI executable only — the approved local-stack / migration-tooling
# version, sourced here for Mac, Bazzite, CI, and preview
# orchestration. This pins the CLI binary ONLY: Supabase
# service images, Postgres major, container lifecycle, generated config.toml,
# and production migration ownership are all deliberately out of mise's scope.
# Bump under the weekly Supabase cooldown + Bazzite rootless-podman/SELinux
# compatibility check (see pinpoint-chores; PP-9mg0).
supabase = "2.117.0"

[settings]
idiomatic_version_file_enable_tools = ["pnpm"]
not_found_auto_install = false
not_found_system_fallback = false
