# PinPoint project toolchain contract.
#
# package.json#packageManager remains the single authority for the exact pnpm
# version and its integrity hash. Mise reads that declaration directly via
# idiomatic_version_file_enable_tools without duplicating the pnpm version here.
#
# Minimum mise version: 2026.11.7. A packageManager entry with a +sha512
# checksum makes mise install pnpm from the npm registry (the `npm:pnpm`
# backend), whatever `[tool_alias]` or a command-line `pnpm` argument says, and
# mise.lock records that backend with the checksum as an option. pnpm 12's npm
# package is only a postinstall stub for its native binary. mise 2026.11.7 is the
# first release that runs that install script on this path, so the installed
# pnpm is the real native binary (mise 2026.8.11 left the stub, PP-rhzk).
# Do not add a `[tool_alias] pnpm = "aqua:pnpm/pnpm"`: it is ignored here, and
# the aqua lock entry it needs is rewritten away by every `mise lock` (PP-66o0).
# The "locked to npm:pnpm, but the registry now installs it from aqua" warning
# is expected; do not run `mise backends switch pnpm`.
min_version = "2026.11.7"

[tools]
node = "24.22.2"
python = "3.15.2"
ruff = "0.17.4"
zizmor = "1.32.0"
actionlint = "1.7.12"
# Supabase CLI executable only — the approved local-stack / migration-tooling
# version, sourced here for Mac, Bazzite, CI, and preview
# orchestration. This pins the CLI binary ONLY: Supabase
# service images, Postgres major, container lifecycle, generated config.toml,
# and production migration ownership are all deliberately out of mise's scope.
# Bump under the weekly Supabase cooldown + Bazzite rootless-podman/SELinux
# compatibility check (see pinpoint-chores; PP-9mg0).
supabase = "2.122.1"

[settings]
idiomatic_version_file_enable_tools = ["pnpm"]
not_found_auto_install = false
not_found_system_fallback = false
