<title>UI Sign-off #2560</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: PR header, changed-page picker, the three viewports side by side, then a decision bar fixed to the bottom. */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --fg:#1b1e27; --muted:#5d6475; --line:#d9dce5;
  --accent:#3d5af1; --accent-fg:#ffffff; --ok:#1d7a4a; --ok-bg:#e3f4ea; --warn:#9a5b00; --warn-bg:#fdf0d8;
  --shot:#e7e9f0;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12141b; --surface:#1b1e27; --fg:#e8eaf0; --muted:#9aa1b2; --line:#2c3040;
  --accent:#7d93ff; --accent-fg:#0e1120; --ok:#5fd39a; --ok-bg:#163527; --warn:#f2b45a; --warn-bg:#3a2a10;
  --shot:#232735; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141b; --surface:#1b1e27; --fg:#e8eaf0; --muted:#9aa1b2; --line:#2c3040;
  --accent:#7d93ff; --accent-fg:#0e1120; --ok:#5fd39a; --ok-bg:#163527; --warn:#f2b45a; --warn-bg:#3a2a10;
  --shot:#232735; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 140px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
header{display:grid;gap:6px}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{font-size:22px;font-weight:600;margin:0;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:13px;align-items:center}
code{font-family:var(--mono);color:var(--fg)}
.pill{display:inline-flex;font-size:12px;font-weight:500;padding:2px 10px;border-radius:999px;background:var(--warn-bg);color:var(--warn)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pages{display:flex;flex-wrap:wrap;gap:8px}
.pages button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:4px 10px;cursor:pointer}
.pages button[aria-current="true"]{border-color:var(--accent);color:var(--accent);font-weight:500}
.note{font-size:14px;color:var(--muted);max-width:65ch;margin:0}
.board{display:grid;gap:16px;align-items:start;grid-template-columns:minmax(0,3.2fr) minmax(0,1.1fr) minmax(0,.85fr)}
@media (max-width:760px){.board{grid-template-columns:minmax(0,1fr)}}
figure{margin:0;display:grid;gap:6px;min-width:0}
figcaption{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
figcaption b{font-weight:500;color:var(--fg)}
.shot{display:block;width:100%;background:var(--shot);border:1px solid var(--line);border-radius:8px;padding:0;overflow:auto;max-height:75vh;cursor:zoom-in}
.shot img{display:block;width:100%;height:auto}
.missing{background:var(--shot);border:1px dashed var(--line);border-radius:8px;padding:24px 12px;font-size:13px;color:var(--muted);text-align:center}
dialog{border:0;padding:0;background:var(--surface);color:var(--fg);max-width:min(1480px,96vw);max-height:92vh;border-radius:10px}
dialog::backdrop{background:rgb(0 0 0 / .6)}
dialog .bar{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line);font-size:13px}
dialog img{display:block;max-width:none}
.decide{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.decide .in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.what{font-size:13px;color:var(--muted);min-width:0}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-size:14px;font-weight:500;border-radius:8px;padding:8px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn:disabled{opacity:.55;cursor:default}
.btn:focus-visible,.pages button:focus-visible,.shot:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.changes{display:grid;gap:8px;width:100%}
.changes textarea{font:inherit;font-size:14px;width:100%;min-height:72px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);padding:8px;box-sizing:border-box}
.done{font-size:14px}
</style>

<!-- The publishing session fills this block for each PR (pinpoint-pr-workflow §3.5).
     head: the full SHA the screenshots were taken from. status: waiting | approved.
     Each shot path is a file published alongside the page; leave one out if it was not captured. -->
<script type="application/json" id="signoff">
{
  "pr": 2560,
  "title": "Machine CSV export",
  "head": "4f1c9a2e7b0d3c58a6f19e2d4b7a0c3e5f8d1b26",
  "captured": "30 Oct, 14:32",
  "status": "waiting",
  "pages": [
    {
      "name": "Machines list",
      "note": "Adds an Export button to the Machines toolbar. Owners and admins only.",
      "shots": {
        "desktop": "shots/machines-desktop.png",
        "large": "shots/machines-430.png",
        "small": "shots/machines-320.png"
      }
    }
  ]
}
</script>

<div class="wrap">
  <header>
    <div class="eyebrow">UI sign-off</div>
    <h1 id="title"></h1>
    <div class="meta">
      <span>PR <code id="pr"></code></span>
      <span>Head <code id="head"></code></span>
      <span id="captured"></span>
      <span class="pill" id="status"></span>
    </div>
  </header>
  <div class="pages" role="group" aria-label="Changed pages" id="pages"></div>
  <p class="note" id="pnote"></p>
  <div class="board" id="board"></div>
</div>

<dialog id="zoom">
  <div class="bar"><span id="zoomTitle"></span><button class="btn" type="button" id="zoomClose">Close</button></div>
  <img id="zoomImg" alt="">
</dialog>

<div class="decide"><div class="in" id="decide"></div></div>

<script>
(() => {
  const data = JSON.parse(document.getElementById("signoff").textContent);
  const head7 = data.head.slice(0, 7);
  const viewports = [
    ["desktop", "Desktop", "1440 × 900"],
    ["large", "Large mobile", "430"],
    ["small", "Small mobile", "320"]
  ];
  const $ = id => document.getElementById(id);
  const el = (tag, props = {}, kids = []) => {
    const n = Object.assign(document.createElement(tag), props);
    n.append(...kids);
    return n;
  };

  $("title").textContent = data.title;
  $("pr").textContent = "#" + data.pr;
  $("head").textContent = head7;
  $("captured").textContent = data.captured ? "Captured " + data.captured : "";

  function setStatus(text, ok) {
    $("status").textContent = text;
    $("status").className = ok ? "pill ok" : "pill";
  }

  // Changed pages and screenshots
  let current = 0;
  function renderPage() {
    const page = data.pages[current];
    document.querySelectorAll("#pages button").forEach((b, i) => b.setAttribute("aria-current", String(i === current)));
    $("pnote").textContent = page.note || "";
    $("board").replaceChildren(...viewports.map(([key, label, size]) => {
      const src = page.shots && page.shots[key];
      const cap = el("figcaption", {}, [el("b", { textContent: label }), el("span", { textContent: size })]);
      if (!src) return el("figure", {}, [cap, el("div", { className: "missing", textContent: "Not captured" })]);
      const btn = el("button", { type: "button", className: "shot", ariaLabel: `Open ${label} full size` },
        [el("img", { src, alt: `${page.name}, ${label}`, loading: "lazy" })]);
      btn.addEventListener("click", () => {
        $("zoomImg").src = src;
        $("zoomTitle").textContent = `${page.name} · ${label}`;
        $("zoom").showModal();
      });
      return el("figure", {}, [cap, btn]);
    }));
  }
  $("pages").replaceChildren(...data.pages.map((p, i) => {
    const b = el("button", { type: "button", textContent: p.name });
    b.addEventListener("click", () => { current = i; renderPage(); });
    return b;
  }));
  $("pages").hidden = data.pages.length < 2;
  renderPage();
  $("zoomClose").addEventListener("click", () => $("zoom").close());
  $("zoom").addEventListener("click", e => { if (e.target === $("zoom")) $("zoom").close(); });

  // Decision: Approve and Request changes send a comment to the Claude session that published this page,
  // which records the approval with approve-ui.sh on this head.
  const decide = $("decide");
  const commentsReady = window.claude?.use ? window.claude.use("comments") : Promise.resolve(null);
  const chatFallback = verb => `Tell Claude in chat: "${verb} #${data.pr} at ${head7}".`;

  function showDone(text) {
    decide.replaceChildren(el("div", { className: "done", textContent: text }));
  }

  function showButtons(message) {
    const req = el("button", { className: "btn", type: "button", textContent: "Request changes" });
    const ok = el("button", { className: "btn primary", type: "button", textContent: "Approve" });
    const what = el("div", { className: "what" });
    what.append(message || "Approving covers head ", ...(message ? [] : [el("code", { textContent: head7 }), ". A later push needs a new sign-off."]));
    decide.replaceChildren(what, el("div", { className: "btns" }, [req, ok]));
    ok.addEventListener("click", () => send(ok, `UI sign-off: approve PR #${data.pr} at ${data.head}.`,
      "Sent to Claude. UI Approval turns green once Claude records the approval.", "approve"));
    req.addEventListener("click", showChanges);
  }

  function showChanges() {
    const ta = el("textarea", { id: "chg", maxLength: 3000, placeholder: "The Export button wraps at 320px" });
    const sendBtn = el("button", { className: "btn primary", type: "button", textContent: "Send to Claude" });
    const back = el("button", { className: "btn", type: "button", textContent: "Back" });
    decide.replaceChildren(el("div", { className: "changes" }, [
      el("label", { className: "what", htmlFor: "chg", textContent: "What should change?" }), ta,
      el("div", { className: "btns" }, [back, sendBtn])
    ]));
    ta.focus();
    back.addEventListener("click", () => showButtons());
    sendBtn.addEventListener("click", () => {
      const note = ta.value.trim();
      if (!note) { ta.focus(); return; }
      send(sendBtn, `UI sign-off: changes requested on PR #${data.pr} at ${data.head}.\n\n${note}`,
        "Sent to Claude: " + note, "request changes on");
    });
  }

  async function send(button, text, doneText, verb) {
    button.disabled = true;
    const comments = await commentsReady;
    let can = "off";
    try { if (comments) can = await comments.canSendToClaude(); } catch { can = "off"; }
    if (can !== "available") {
      button.disabled = false;
      const why = can === "no_session" ? "The Claude session is not open. " : "This view cannot reach Claude. ";
      showButtons(why + chatFallback(verb));
      return;
    }
    try {
      const anchor = await comments.anchorFor(decide);
      await comments.sendToClaude({ anchor, text });
      if (verb === "approve") setStatus("Sent for approval", true);
      else setStatus("Changes requested", false);
      showDone(doneText);
    } catch (err) {
      button.disabled = false;
      const code = err && err.code;
      const msg = code === "consent_required" ? "Not sent: allow this page to comment for you, then press again."
        : code === "forbidden" ? "Commenting from this page is off here. " + chatFallback(verb)
        : code === "claude_unavailable" ? "The Claude session could not take it. " + chatFallback(verb)
        : "Not sent. Press again, or " + chatFallback(verb).charAt(0).toLowerCase() + chatFallback(verb).slice(1);
      showButtons(msg);
    }
  }

  if (data.status === "approved") {
    setStatus("Approved", true);
    showDone(`Approved head ${head7}. UI Approval is recorded.`);
  } else {
    setStatus("Waiting for you", false);
    showButtons();
  }
})();
</script>
