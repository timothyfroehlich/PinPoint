version: 2
updates:
  # pnpm dependencies with different cooldowns per update type
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    target-branch: "main"
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps)"
      include: "scope"
    # Cooldown: 2 weeks for minor/patch, 1 month for major
    cooldown:
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 14
    groups:
      # Group minor and patch updates together (Tiptap excluded — see the tiptap
      # group; it must move in lockstep and skews transiently. PP-sg3m)
      minor-patch-updates:
        applies-to: version-updates
        exclude-patterns:
          - "@tiptap/*"
        update-types:
          - "minor"
          - "patch"
      # Tiptap adapter packages import internal helpers from @tiptap/core that
      # only exist in the exactly-matching core version. Isolating them so a
      # transient skew (unpinned transitive core vs. cooldown-held direct deps)
      # never blocks the rest of the minor-patch group. PP-sg3m
      tiptap:
        applies-to: version-updates
        patterns:
          - "@tiptap/*"
        update-types:
          - "minor"
          - "patch"
      # Group minor and patch security updates
      security-updates:
        applies-to: security-updates
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "pnpm"

  # GitHub Actions with 2-week cooldown
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps)"
      include: "scope"
    # 2 week cooldown for all GitHub Actions updates
    cooldown:
      default-days: 14
    groups:
      # One PR per weekly wave instead of one per action. Without this key every
      # action bump opened its own PR (e.g. #1725 + #1726), multiplying the
      # review/merge cycles for what is functionally a single maintenance batch.
      # Mirrors the npm block's minor-patch-updates group; no patterns/update-types
      # filter, so majors ride along in the same PR — the cooldown already holds
      # them 14 days and the reviewer still sees each bump in the diff. (PP-c0uy)
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "github-actions"
