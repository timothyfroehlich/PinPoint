name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - claude/**

permissions: read-all  # zizmor: ignore[excessive-permissions]

# Cancel superseded PR runs; never cancel a push to main.
#
# A PR push supersedes the one before it — same branch, same question, and the
# older answer is worthless — so cancelling saves runners with nothing lost.
# A push to main is the opposite: each one is a distinct commit whose result is
# the thing we want, and `test-e2e-comprehensive` takes ~30 minutes to produce
# it. Under a shared `${{ github.ref }}` group every merge cancelled the
# previous merge's run, so on any evening with more than one merge per half
# hour that job was cancelled far more often than it finished — leaving the
# same silent non-verdict PP-jxhy set out to remove, reached by a different
# route. (Observed on run 31755670441: Smoke evaluated clean, then the Full
# step was cancelled 30 minutes in by two later merges, and both the Full
# evaluate and the gating step skipped.)
#
# Appending the SHA on `push` gives every main commit its own group, so main
# runs neither cancel nor queue behind each other. Pull-request runs keep the
# ref-based group and the old behaviour exactly.
#
# Not job-level `concurrency` on that job: job-level groups govern queueing
# between jobs, they do not exempt a job from the workflow-level cancel. Not
# `cancel-in-progress: false` either — main runs would then serialize, so one
# 30-minute comprehensive job delays the next main run by up to 30 minutes and
# they pile up. (PP-tbhv.)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  # Detect which files changed to skip expensive jobs for non-website PRs.
  # "Non-website" covers: docs (docs/**, **/*.md), beads (.beads/**), agent
  # configs (.agent[s]/**, .claude/**, .codex/**), the non-TS/JS files under
  # scripts/ (scripts/**/*.{py,sh,sql,json,txt} and the whole scripts/tests/**
  # tree), editor / IDE / git configs
  # (.husky/**, .vscode/**, pinpoint.code-workspace, .gitattributes, .gitignore),
  # test/linter configs (pytest.ini, ruff.toml, .yamllint.yml, .gitleaks.toml),
  # and non-PR GitHub Action configs/workflows (dependabot.yml, renovate.json,
  # CODEOWNERS, ownerless-renovate-issues.yaml, preview-*.yaml,
  # codex-reaction-witness.yaml).
  #
  # Note: under scripts/, only TS/JS (.ts/.mjs) counts as code. Python and shell
  # are excluded (the always-running `linters` job covers them: pytest
  # scripts/tests/, ruff, shellcheck), and .sql/.json/.txt plus the whole
  # scripts/tests/** tree are excluded as data/config the site build can't
  # depend on. TS/JS is NOT excluded because it is real code
  # (scripts/migrate-production.ts runs on every Vercel prod build,
  # scripts/lib/pg-client.mjs is the PP-d8l8 prod commit-loss file,
  # tsconfig.app.json includes some, scripts/workflow/pr-watcher-mcp.ts has a
  # vitest spec) that the linters job never touches, so it must get typecheck,
  # lint, test, and build. package.json is likewise NOT excluded — a
  # package.json-only edit (packageManager pin, a script, an engines bump) with no
  # lockfile change must still re-run setup and the full suite. (PP-9jar)
  #
  # .github/workflows/ci.yml and .github/actions/** are intentionally NOT excluded —
  # any change to the CI workflow or its composite actions directly affects what
  # CI runs, so we keep triggering full CI to validate it.
  #
  # Uses predicate-quantifier: 'every' with a positive '**' plus negative
  # exclusions. A changed file counts as "code" only when it matches every
  # pattern — i.e. it matches '**' (always) AND is NOT under any excluded
  # path. `has_code` is true if at least one changed file is "code". A
  # PR touching only excluded paths produces has_code=false and downstream
  # expensive jobs cascade-skip via `setup`'s `if:` gate. New / unknown
  # directories default to running full CI — the safe failure mode.
  #
  # Why 'every' and not 'some': under 'some', the positive '**' matches every
  # file by itself, short-circuiting the negative exclusions and forcing
  # has_code=true on every PR. PR #1327 / PP-r5v shipped 'some' and the
  # filter never fired (e.g. PR #1386, a single .agent/skills/*.md change,
  # still ran the full E2E suite).
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.set-code.outputs.code }}
      deps: ${{ steps.deps-filter.outputs.deps }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # ratchet:step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # ratchet:dorny/paths-filter@v4.0.3
        with:
          predicate-quantifier: "every"
          filters: |
            has_code:
              - '**'
              - '!docs/**'
              - '!*.md'
              - '!**/*.md'
              - '!.beads/**'
              - '!.agent/**'
              - '!.agents/**'
              - '!.claude/**'
              - '!.codex/**'
              - '!.husky/**'
              - '!.vscode/**'
              - '!pinpoint.code-workspace'
              - '!LICENSE'
              - '!.gitignore'
              - '!.gitattributes'
              - '!pytest.ini'
              - '!ruff.toml'
              - '!.yamllint.yml'
              - '!.gitleaks.toml'
              - '!scripts/**/*.py'
              - '!scripts/**/*.sh'
              - '!scripts/**/*.sql'
              - '!scripts/**/*.json'
              - '!scripts/**/*.txt'
              - '!scripts/tests/**'
              - '!.github/dependabot.yml'
              - '!.github/renovate.json'
              - '!.github/CODEOWNERS'
              - '!.github/workflows/codex-reaction-witness.yaml'
              - '!.github/workflows/ownerless-renovate-issues.yaml'
              - '!.github/workflows/preview-control.yaml'
              - '!.github/workflows/preview-reaper.yaml'
      # Separate filter for dependency changes using default "some" quantifier
      # so deps=true when ANY changed file is a dependency file (not ALL).
      - id: deps-filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # ratchet:dorny/paths-filter@v4.0.3
        with:
          filters: |
            deps:
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
      - name: Determine code changes
        id: set-code
        env:
          HAS_CODE: ${{ steps.filter.outputs.has_code }}
        run: |
          if [ "$HAS_CODE" = "true" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Required parallel canary for the locked mise toolchain. Keep the existing
  # job graph intact until the later cutover so it remains the rollback path.
  mise-canary:
    name: mise Toolchain Canary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # ratchet:step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup locked mise toolchain
        id: toolchain
        uses: ./.github/actions/setup-mise
        with:
          install-args: "--locked"

      - name: Verify locked toolchain versions
        shell: bash
        run: |
          set -euo pipefail

          assert_version() {
            local tool="$1"
            local expected="$2"
            local actual="$3"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::${tool} version mismatch: expected ${expected}, got ${actual}"
              exit 1
            fi
            echo "${tool} ${actual}"
          }

          node_version="$(node --version)"
          node_version="${node_version#v}"
          pnpm_version="$(pnpm --version)"
          python_version="$(python3 -c 'import platform; print(platform.python_version())')"
          supabase_version="$(supabase --version)"

          expected_node="$(python3 -c 'import tomllib; print(tomllib.load(open("mise.toml", "rb"))["tools"]["node"])')"
          expected_pnpm="$(python3 -c 'import json; value=json.load(open("package.json"))["packageManager"]; print(value.split("@", 1)[1].split("+", 1)[0])')"
          expected_python="$(python3 -c 'import tomllib; print(tomllib.load(open("mise.toml", "rb"))["tools"]["python"])')"
          expected_supabase="$(python3 -c 'import tomllib; print(tomllib.load(open("mise.toml", "rb"))["tools"]["supabase"])')"

          assert_version node "$expected_node" "$node_version"
          assert_version pnpm "$expected_pnpm" "$pnpm_version"
          assert_version python "$expected_python" "$python_version"
          assert_version supabase "$expected_supabase" "$supabase_version"

      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # ratchet:actions/cache@v6.1.0
        with:
          path: node_modules
          key: ${{ steps.toolchain.outputs.node-modules-key }}

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Run representative static checks
        run: |
          pnpm run typecheck
          pnpm run typecheck:tests
          pnpm run lint
          pnpm run format
          ruff check scripts/
          ruff format --check scripts/

      - name: Run representative unit tests
        run: |
          set -a
          source .env.ci
          set +a
          pnpm run test

      - name: Build application
        run: |
          set -a
          source .env.ci
          set +a
          pnpm run build

  # Setup job caches dependencies for reuse by other jobs
  setup:
    name: Setup Dependencies
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.deps == 'true'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # ratchet:step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup locked mise toolchain
        id: toolchain
        uses: ./.github/actions/setup-mise

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # ratchet:actions/cache@v6.1.0
        with:
          path: node_modules
          key: ${{ steps.toolchain.outputs.node-modules-key }}

  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # ratchet:step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup locked mise toolchain
        id: toolchain
        uses: ./.github/actions/setup-mise

      - name: Restore node_modules
        id: cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # ratchet:actions/cache/restore@v6.1.0
        with:
          path: node_modules
          key: ${{ steps.toolchain.outputs.node-modules-key }}

      - name: Install dependencies (if cache miss)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Run type checking
        run: pnpm run typecheck

      - name: Run test type checking (native tsc)
        run: pnpm run typecheck:tests

  lint:
    name: Oxlint
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # ratchet:step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup locked mise toolchain
        id: toolchain
        uses: ./.github/actions/setup-mise

      - name: Restore node_modules
        id: cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # ratchet:actions/cache/restore@v6.1.0
        with:
          path: node_modules
          key: ${{ steps.toolchain.outputs.node-modules-key }}

      - name: Install dependencies (if cache miss)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Run linting
        run: pnpm run lint

  format:
    name: Prettier Format Check
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # ratchet:step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup locked mise toolchain
        id: toolchain
        uses: ./.github/actions/setup-mise

      - name: Restore node_modules
        id: cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # ratchet:actions/cache/restore@v6.1.0
        with:
          path: node_modules
          key: ${{ steps.toolchain.outputs.node-modules-key }}

      - name: Install dependencies (if cache miss)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format

  # Fast linters that always run — cheap enough to never skip.
  linters:
    name: Fast Linters
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # ratchet:step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install system linters
        run: |
          sudo apt-get update
          sudo apt-get install -y yamllint shellcheck

      - name: Setup locked Python toolchain
        uses: ./.github/actions/setup-mise
        with:
          install-args: "--locked python ruff zizmor"
          cache-pnpm: "false"

      - name: Install Python test dependencies
        run: python3 -m pip install -r scripts/requirements.txt

      - name: YAML lint
        run: yamllint .

      - name: Check skill frontmatter
        run: python3 scripts/check_skill_frontmatter.py

      - name: Action lint
        env:
          ACTIONLINT_VERSION: "1.7.11"
        run: |
          dl="https://raw.githubusercontent.com/rhysd/actionlint"
          dl="${dl}/main/scripts/download-actionlint.bash"
          bash <(curl -sL "$dl") "$ACTIONLINT_VERSION"
          find .github/workflows \( -name '*.yml' -o -name '*.yaml' \) \
            ! -name '*.lock.yml' -print0 | xargs -0 ./actionlint

      - name: Ruff check
        run: ruff check scripts/

      - name: Ruff format check
        run: ruff format --check scripts/

      - name: Pytest (scripts)
        run: python3 -m pytest scripts/tests/

      - name: ShellCheck
        run: find scripts/ .claude/hooks/ -name '*.sh' -print0 | xargs -0 shellcheck

      - name: Zizmor (GitHub Actions security)
        run: |
          find .github/workflows \( -name '*.yml' -o -name '*.yaml' \) \
            ! -name '*.lock.yml' -print0 \
            | xargs -0 zizmor --min-severity low --format plain \
                .github/actions/setup-mise/action.yml

      - name: Ratchet Check (pinned actions)
        uses: sethvargo/ratchet@a7ead07a89972fef4316ad196af18f87ac77bb97  # ratchet:sethvargo/ratchet@main
        with:
          files: |
            .github/actions/setup-mise/action.yml
            .github/workflows/ci.yml
            .github/workflows/preview-control.yaml
            .github/workflows/preview-reaper.yaml

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [setup, typecheck, lint, format, linters, test-unit, test-integration]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # ratchet:step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup locked mise toolchain
        id: toolchain
        uses: ./.github/actions/setup-mise

      - name: Restore node_modules
        id: cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # ratchet:actions/cache/restore@v6.1.0
        with:
          path: node_modules
          key: ${{ steps.toolchain.outputs.node-modules-key }}

      - name: Install dependencies (if cache miss)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: |
          # Load CI environment variables for build-time evaluation
          set -a
          source .env.ci
          set +a
          pnpm run build

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # ratchet:step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup locked mise toolchain
        id: toolchain
        uses: ./.github/actions/setup-mise

      - name: Restore node_modules
        id: cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # ratchet:actions/cache/restore@v6.1.0
        with:
          path: node_modules
          key: ${{ steps.toolchain.outputs.node-modules-key }}

      - name: Install dependencies (if cache miss)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Run unit tests with coverage
        run: |
          set -a
          source .env.ci
          set +a
          pnpm run test:coverage


  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # ratchet:step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup locked mise toolchain
        id: toolchain
        uses: ./.github/actions/setup-mise

      - name: Restore node_modules
        id: cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # ratchet:actions/cache/restore@v6.1.0
        with:
          path: node_modules
          key: ${{ steps.toolchain.outputs.node-modules-key }}

      - name: Install dependencies (if cache miss)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Run integration tests
        run: |
          set -a
          source .env.ci
          set +a
          pnpm run test:integration

  # ==============================================================================
  # Migration Verification
  #
  # Validates that Drizzle migrations can apply cleanly to a fresh database.
  # Uses Supabase CLI since migrations reference auth.users (Supabase-specific).
  # This catches broken migrations before they reach production.
  # ==============================================================================
  test-migrations:
    name: Verify Migrations
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # ratchet:step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Reserve Supabase ports
        uses: ./.github/actions/reserve-supabase-ports

      - name: Setup locked mise toolchain
        id: toolchain
        uses: ./.github/actions/setup-mise
        with:
          install-args: "--locked node pnpm supabase"

      - name: Restore node_modules
        id: cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # ratchet:actions/cache/restore@v6.1.0
        with:
          path: node_modules
          key: ${{ steps.toolchain.outputs.node-modules-key }}

      - name: Install dependencies (if cache miss)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase
        uses: ./.github/actions/setup-supabase
        with:
          seed: "false"

      - name: Apply migrations to fresh database
        run: pnpm run db:migrate

      - name: Verify migration metadata integrity
        run: pnpm run check:migrations

      - name: Ensure test schema is current
        run: |
          set -a
          source .env.ci
          set +a
          pnpm run test:ensure-schema

  test-integration-supabase:
    name: Supabase Integration Tests
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && (needs.changes.outputs.code == 'true' || needs.changes.outputs.deps == 'true') }}
    needs: [changes, setup, typecheck, lint, format, linters, test-unit, test-integration, test-migrations]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # ratchet:step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Reserve Supabase ports
        uses: ./.github/actions/reserve-supabase-ports

      - name: Setup locked mise toolchain
        id: toolchain
        uses: ./.github/actions/setup-mise
        with:
          install-args: "--locked node pnpm supabase"

      - name: Restore node_modules
        id: cache-restore
