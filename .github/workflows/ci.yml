name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - claude/**

permissions: read-all  # zizmor: ignore[excessive-permissions]

# PR runs: a new push cancels the run in progress. Main runs: one at a time,
# never cancelled mid-run.
#
# A PR push supersedes the one before it — same branch, same question, and the
# older answer is worthless — so cancelling saves runners with nothing lost.
#
# Main shares one group with `cancel-in-progress: false`. A running main run
# always finishes, so the post-merge comprehensive verdict is never cut off
# mid-suite (run 31755670441 lost its Full verdict that way under PP-tbhv's
# original shared group with cancel-in-progress). GitHub keeps at most one
# more run waiting: a newer push to main cancels the waiting run before it
# starts and waits in its place. Commits in a merge burst therefore get no run
# of their own. The next run that executes covers them: the `changes` job's
# code filter diffs against the last main commit a run passed on, not this
# push's `before`, so their code still selects E2E. (Dependency changes are
# audited on their PRs; the push audit stays per push.) A red result may come
# from any commit since the last passing one, and while main stays red every
# main run repeats the jobs the red range selects.
#
# A re-run joins this group too: re-running a main run while a newer merge's
# run is waiting cancels that waiting run.
#
# This replaces per-SHA groups (PP-tbhv), which never cancelled but let every
# merge run at once — up to 10 concurrent main runs in a day, each holding
# runners under the account's 20-job cap while PR jobs queued. A main run takes
# ~15-20 minutes (the comprehensive legs run in parallel, PP-yva7.3), so a
# merge normally waits at most one run before a run covering it starts (a
# hung run holds the slot until its job timeouts end it).
# (PP-yva7.7.)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detect which files changed so non-website PRs skip the expensive jobs
  # (integration, migrations, Supabase, E2E). `static` and `linters` always
  # run, so a hole in this filter can skip E2E but never type-check, lint,
  # unit tests or the build.
  #
  # "Non-website": docs and *.md, .beads, agent configs (.agent[s], .claude,
  # .codex), non-TS/JS files under scripts/ (py/sh/sql/json/txt and
  # scripts/tests/**), editor/git configs, test/linter configs, and the
  # GitHub configs/workflows that don't affect this workflow. TS/JS under
  # scripts/ and package.json count as code (scripts/migrate-production.ts runs
  # on every prod build; PP-9jar). ci.yml and .github/actions/** always count.
  #
  # predicate-quantifier 'every' with a positive '**' plus negative exclusions:
  # a file is "code" only if it is excluded by none of them. New or unknown
  # paths default to running full CI.
  #
  # Why 'every' and not 'some': under 'some', the positive '**' matches every
  # file by itself, short-circuiting the negative exclusions and forcing
  # has_code=true on every PR. PR #1327 / PP-r5v shipped 'some' and the
  # filter never fired (e.g. PR #1386, a single .agent/skills/*.md change,
  # still ran the full E2E suite).
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.set-code.outputs.code }}
      deps: ${{ steps.base.outputs.force == 'true' && 'true' || steps.deps-filter.outputs.deps }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # ratchet:step-security/harden-runner@v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
          # Push runs diff back past `before` (next step); PR runs use the API.
          # Strings, because a bare 0 is falsy in an expression.
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}

      # Main runs one at a time and a newer merge cancels the waiting run (see
      # the concurrency block), so this push's `before` can skip merges whose
      # run never started. Diffing against the last main commit a run PASSED on
      # makes every change since then select the jobs that test it: a merge
      # whose run was cancelled while waiting, cancelled mid-run, or failed
      # before E2E ran (in setup, say) is still covered by the next run. Each
      # passing run covered everything since the one before it, so the chain
      # holds. (PP-yva7.7.)
      - name: Find the last main commit CI passed on
        id: base
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # No narrower fallback: diffing from `before` could skip a superseded
          # merge, and a run that passed that way would become the next base.
          # When the base is unknown, every job runs instead.
          # A run being re-run is in progress, so status=success already leaves
          # it out; the select also ignores any other passing run of this same
          # commit, so the diff is never empty against itself.
          if ! sha=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=5" \
            --jq "[.workflow_runs[] | select(.head_sha != \"$GITHUB_SHA\")][0].head_sha // empty"); then
            echo "::warning::Could not list main's CI runs; running every job."
            echo "force=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$sha" ]; then
            echo "::warning::No passing main run found; running every job."
            echo "force=true" >> "$GITHUB_OUTPUT"
          elif ! git merge-base --is-ancestor "$sha" HEAD; then
            echo "::warning::Last passing main run ($sha) is not an ancestor of this commit (a re-run of an older commit?); running every job."
            echo "force=true" >> "$GITHUB_OUTPUT"
          else
            echo "Diffing against $sha, the last main commit CI passed on."
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
          fi

      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # ratchet:dorny/paths-filter@v4.0.3
        with:
          base: ${{ steps.base.outputs.sha }}
          predicate-quantifier: "every"
          filters: |
            has_code:
              - '**'
              - '!docs/**'
              - '!*.md'
              - '!**/*.md'
              - '!.beads/**'
              - '!.agent/**'
              - '!.agents/**'
              - '!.claude/**'
              - '!.codex/**'
              - '!.husky/**'
              - '!.vscode/**'
              - '!pinpoint.code-workspace'
              - '!LICENSE'
              - '!.gitignore'
              - '!.gitattributes'
              - '!pytest.ini'
              - '!ruff.toml'
              - '!.yamllint.yml'
              - '!.gitleaks.toml'
              - '!scripts/**/*.py'
              - '!scripts/**/*.sh'
              - '!scripts/**/*.sql'
              - '!scripts/**/*.json'
              - '!scripts/**/*.txt'
              - '!scripts/tests/**'
              - '!.github/dependabot.yml'
              - '!.github/renovate.json'
              - '!.github/CODEOWNERS'
              - '!.github/workflows/ownerless-renovate-issues.yaml'
              - '!.github/workflows/preview-control.yaml'
              - '!.github/workflows/preview-reaper.yaml'
      # Separate filter for dependency changes using default "some" quantifier
      # so deps=true when ANY changed file is a dependency file (not ALL).
      - id: deps-filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # ratchet:dorny/paths-filter@v4.0.3
        # Per push, not reached back: the push audit compares against
        # `before`, and every lockfile change was already audited on its PR.
        with:
          filters: |
            deps:
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
      - name: Determine code changes
        id: set-code
        env:
          HAS_CODE: ${{ steps.filter.outputs.has_code }}
          FORCE: ${{ steps.base.outputs.force }}
        run: |
          if [ "$HAS_CODE" = "true" ] || [ "$FORCE" = "true" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Static checks, unit tests and build. Always runs (no path filter), so a
  # change that only touches files the filter treats as non-code still gets
  # type-checked, linted and unit-tested.
  static:
    name: Static checks, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # ratchet:step-security/harden-runner@v2.22.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup locked mise toolchain
        id: toolchain
        uses: $/.github/actions/setup-mise
        with:
          install-args: "--locked"

      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # ratchet:actions/cache@v6.1.0
        with:
          path: node_modules
          key: ${{ steps.toolchain.outputs.node-modules-key }}

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: |
          pnpm run typecheck
          pnpm run typecheck:tests
          pnpm run typecheck:e2e

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format

      - name: Unit tests
        run: |
          set -a
          source .env.ci
          set +a
          pnpm run test:_run

      - name: Build application
        run: |
          set -a
          source .env.ci
          set +a
          pnpm run build

  # Job count, not job length, is what makes PR CI slow: every job waits for one
  # of the account's 20 concurrent runner slots, and in a busy hour a job waits
  # ~10 minutes for one and then runs 3-5. So checks that need the same setup
  # share a job, and nothing runs as its own job to save a minute of wall clock.
  # A code PR run is 7 jobs: Detect Changes, Static, Fast Linters, Integration,
  # E2E Smoke, E2E Full, CI Gate. Under the old 15 (2026-11-15 measurements,
  # PP-bg1u), two PRs pushed together filled the cap.
  #
  # There is no dependency-cache job. `static` saves the node_modules cache
  # (actions/cache), and every other job restores it and installs on a miss,
  # so a lockfile change costs each job one install instead of a queue hop.

  # Fast linters that always run — cheap enough to never skip. Gitleaks runs
  # here, not in a job of its own (~20s of work against a slot's ~2 min of
  # wait and setup).
  linters:
    name: Fast Linters
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # ratchet:step-security/harden-runner@v2.22.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # Gitleaks scans the commits, not the tree

      # The gitleaks CLI, not gitleaks-action: the action refuses to run in a
      # repository owned by an organization without a GITLEAKS_LICENSE key,
      # and PinPoint moved to the minamaya org. The CLI needs no key. Same scan
      # as the action: the commits this event introduces, merges skipped.
      - name: Gitleaks secret scan
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
          MQ_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          case "$EVENT_NAME" in
            pull_request) range="${PR_BASE}..${PR_HEAD}" ;;
            merge_group) range="${MQ_BASE}..${MQ_HEAD}" ;;
            push)
              if [[ -z "$PUSH_BEFORE" || "$PUSH_BEFORE" =~ ^0+$ ]]; then
                range="-1 ${PUSH_AFTER}"
              else
                range="${PUSH_BEFORE}..${PUSH_AFTER}"
              fi ;;
            *) range="-1 HEAD" ;;
          esac
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code=2 \
            --log-opts="--no-merges --first-parent ${range}" .

      - name: Install system linters
        run: |
          sudo apt-get update
          sudo apt-get install -y yamllint shellcheck

      - name: Setup locked Python toolchain
        uses: $/.github/actions/setup-mise
        with:
          install-args: "--locked python ruff zizmor actionlint"
          cache-pnpm: "false"

      - name: Install Python test dependencies
        run: python3 -m pip install -r scripts/requirements.txt

      - name: YAML lint
        run: yamllint .

      - name: Check skill frontmatter
        run: python3 scripts/check_skill_frontmatter.py

      # actionlint reads .github/actionlint.yaml, which ignores the
      # self-repository `uses: $/...` references until rhysd/actionlint#711.
      - name: Action lint
        run: |
          find .github/workflows \( -name '*.yml' -o -name '*.yaml' \) \
            ! -name '*.lock.yml' -print0 | xargs -0 actionlint

      - name: Ruff check
        run: ruff check scripts/

      - name: Ruff format check
        run: ruff format --check scripts/

      - name: Pytest (scripts)
        run: python3 -m pytest scripts/tests/

      - name: Check E2E spec locations
        run: python3 scripts/check_e2e_spec_locations.py

      - name: ShellCheck
        run: find scripts/ .claude/hooks/ -name '*.sh' -print0 | xargs -0 shellcheck

      - name: Zizmor (GitHub Actions security)
        run: |
          find .github/workflows \( -name '*.yml' -o -name '*.yaml' \) \
            ! -name '*.lock.yml' -print0 \
            | xargs -0 zizmor --min-severity low --format plain \
                .github/actions/setup-mise/action.yml

      - name: Ratchet Check (pinned actions)
        uses: sethvargo/ratchet@a7ead07a89972fef4316ad196af18f87ac77bb97  # ratchet:sethvargo/ratchet@main
        with:
          files: |
            .github/actions/setup-mise/action.yml
            .github/workflows/ci.yml
            .github/workflows/preview-control.yaml
            .github/workflows/preview-reaper.yaml

  # PGlite integration tests, plus `pnpm audit` when the lockfile changed.
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.deps == 'true'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # ratchet:step-security/harden-runner@v2.22.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
          # The audit reads the base commit's lockfile. Strings, because a
          # bare 0 is falsy in an expression.
          fetch-depth: ${{ needs.changes.outputs.deps == 'true' && '0' || '1' }}

      - name: Setup locked mise toolchain
        id: toolchain
        uses: $/.github/actions/setup-mise

      - name: Restore node_modules
        id: cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # ratchet:actions/cache/restore@v6.1.0
        with:
          path: node_modules
          key: ${{ steps.toolchain.outputs.node-modules-key }}

      - name: Install dependencies (if cache miss)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Run integration tests
        run: |
          set -a
          source .env.ci
          set +a
          pnpm run test:integration

      # Only when the lockfile changed. Fails only on high/critical advisories
      # the change adds over its base: one published against a version already
      # locked on main is Dependabot's job (dependabot.yml security updates) and
      # must not block unrelated dependency PRs. After the tests, and on their
      # failure too, so one verdict never hides the other. pnpm audit reads the
      # lockfile only. `--dir` keeps pnpm's mise shim resolving from the
      # checkout.
      - name: Run pnpm audit
        if: ${{ !cancelled() && needs.changes.outputs.deps == 'true' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Writes "<id> <package>: <title>" per high/critical advisory in the
          # lockfile at $1 to $RUNNER_TEMP/$2.ids; fails when there is no report.
          audit() {
            local out="$RUNNER_TEMP/$2"
            pnpm --dir "$1" --pm-on-fail=ignore audit --json >"$out.json" 2>"$out.err" || true
            jq -e '.advisories | type == "object"' "$out.json" >/dev/null 2>&1 || return 1
            jq -r '.advisories | to_entries[]
              | select(.value.severity == "high" or .value.severity == "critical")
              | "\(.key) \(.value.module_name): \(.value.title)"' "$out.json" >"$out.ids"
          }

          if ! audit . head; then
            cat "$RUNNER_TEMP/head.json" "$RUNNER_TEMP/head.err"
            registry_errors="ERR_PNPM_AUDIT_BAD_RESPONSE|ERR_PNPM_AUDIT_REGISTRY"
            registry_errors+="|ECONNREFUSED|EAI_AGAIN|ETIMEDOUT"
            if grep -qE "$registry_errors" "$RUNNER_TEMP/head.json" "$RUNNER_TEMP/head.err"; then
              echo "::warning::pnpm audit skipped: registry error"
              exit 0
            fi
            echo "::error::pnpm audit produced no report."
            exit 1
          fi

          base="$RUNNER_TEMP/base"
          mkdir -p "$base"
          for f in package.json pnpm-lock.yaml pnpm-workspace.yaml; do
            git show "$BASE_SHA:$f" >"$base/$f" 2>/dev/null || rm -f "$base/$f"
          done
          if ! audit "$base" base; then
            echo "::warning::Could not audit the base lockfile; every advisory counts as new."
            : >"$RUNNER_TEMP/base.ids"
          fi

          new=$(awk 'FILENAME == ARGV[1] { seen[$1]; next } !($1 in seen)' \
            "$RUNNER_TEMP/base.ids" "$RUNNER_TEMP/head.ids")
          if [[ -s "$RUNNER_TEMP/base.ids" ]]; then
            echo "Already on the base (Dependabot's job):"
            cat "$RUNNER_TEMP/base.ids"
          fi
          if [[ -n "$new" ]]; then
            echo "::error::This change adds high/critical advisories:"
            echo "$new"
            exit 1
          fi
          echo "No high/critical advisories added over the base."

  # ==============================================================================
  # PR E2E: two jobs, unsharded
  #
  # Each E2E job pays ~130s before its first test: ~95s of checkout, toolchain,
  # cache restore and Supabase start, then ~35s of `next build` inside the
  # Playwright step. The tests themselves are short (2026-11-15: ~45s per smoke
  # project, ~3 min for Full on chromium at 3 workers). Sharding repeated that
  # 130s on every shard and took a runner slot each, which under the account's
  # 20-job cap costs far more in queueing than it saves in test time. One job
  # per suite instead (PP-bg1u; the shards came from PP-yva7.2):
  #   - Smoke runs chromium and Mobile Chrome in one Playwright process against
  #     one database, as the comprehensive legs already do with three browsers.
  #   - Full also runs the Supabase integration tests and checks the migration
  #     metadata, since it already has a migrated Supabase stack. Setup
  #     Supabase applies every migration to a fresh database, so a migration
  #     that cannot apply fails there. E2E global setup fast-resets the
  #     database, so the integration tests leave nothing behind for E2E.
  # Both need only `changes`, so they start within a minute of the run, not
  # after static and integration finish. CI Gate still needs every job; the cost
  # is runner time spent on E2E in a run that static goes on to fail. (PP-yva7.1.)
  # ==============================================================================
  test-e2e-smoke:
    name: E2E Smoke Tests (Chromium, Mobile Chrome)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && (needs.changes.outputs.code == 'true' || needs.changes.outputs.deps == 'true') }}
    needs: changes
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # ratchet:step-security/harden-runner@v2.22.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup locked mise toolchain
        id: toolchain
        uses: $/.github/actions/setup-mise
        with:
          install-args: "--locked node pnpm supabase"

      - name: Restore node_modules
        id: cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # ratchet:actions/cache/restore@v6.1.0
        with:
          path: node_modules
          key: ${{ steps.toolchain.outputs.node-modules-key }}

      - name: Install dependencies (if cache miss)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Setup Playwright browsers
        uses: $/.github/actions/setup-playwright
        with:
          browsers: chromium

      - name: Setup Supabase
        uses: $/.github/actions/setup-supabase

      - name: Run Smoke Tests (Chromium, Mobile Chrome)
        env:
          MOCK_BLOB_STORAGE: "true"
          # Production server: the webServer runs `next build && next start`
          # inside this step, after Setup Supabase exported the NEXT_PUBLIC_*
          # values the build inlines. See playwright.config.ts (PP-izj5).
          PLAYWRIGHT_WEB_SERVER: "start"
          PLAYWRIGHT_STDOUT: "pipe"
          PLAYWRIGHT_STDERR: "pipe"
          UNSUBSCRIBE_SIGNING_SECRET: "ci-test-only-not-a-real-secret-0000000000000000000000000000000000"
        run: pnpm exec playwright test e2e/smoke --project=chromium --project="Mobile Chrome"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # ratchet:actions/upload-artifact@v7.0.2
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 7

  test-e2e-full-chromium:
    name: E2E Full Tests (Chromium), Supabase integration
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && (needs.changes.outputs.code == 'true' || needs.changes.outputs.deps == 'true') }}
    needs: changes
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # ratchet:step-security/harden-runner@v2.22.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup locked mise toolchain
        id: toolchain
        uses: $/.github/actions/setup-mise
        with:
          install-args: "--locked node pnpm supabase"

      - name: Restore node_modules
        id: cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # ratchet:actions/cache/restore@v6.1.0
        with:
          path: node_modules
          key: ${{ steps.toolchain.outputs.node-modules-key }}

      - name: Install dependencies (if cache miss)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Setup Playwright browsers
        uses: $/.github/actions/setup-playwright
        with:
          browsers: chromium

      - name: Setup Supabase
        id: supabase
        uses: $/.github/actions/setup-supabase

      - name: Verify migration metadata integrity
        run: pnpm run check:migrations

      # This step and the next run whenever Supabase is up, even after an
      # earlier check failed, so one red step never hides another verdict.
      # Runs test:ensure-schema first, so a stale test schema fails here.
      - name: Run Supabase integration tests
        if: ${{ !cancelled() && steps.supabase.outcome == 'success' }}
        run: pnpm run test:integration:supabase

      - name: Run Full Tests (Chromium)
        if: ${{ !cancelled() && steps.supabase.outcome == 'success' }}
        env:
          MOCK_BLOB_STORAGE: "true"
          # Production server: the webServer runs `next build && next start`
          # inside this step, after Setup Supabase exported the NEXT_PUBLIC_*
          # values the build inlines. See playwright.config.ts (PP-izj5).
          PLAYWRIGHT_WEB_SERVER: "start"
          PLAYWRIGHT_STDOUT: "pipe"
          PLAYWRIGHT_STDERR: "pipe"
          UNSUBSCRIBE_SIGNING_SECRET: "ci-test-only-not-a-real-secret-0000000000000000000000000000000000"
        run: pnpm exec playwright test --config=playwright.config.full.ts --project=chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # ratchet:actions/upload-artifact@v7.0.2
        with:
          name: playwright-report-full-chromium
          path: playwright-report/
          retention-days: 7

  test-e2e-comprehensive:
    # ==============================================================================
    # E2E Comprehensive Tests (Post-Merge)
    #
    # Runs the full E2E suite across all browsers after merging to main.
    # Not a required check for PR merge — runs only on push to main.
    #
    # Six parallel legs: Smoke in 2 shards, Full in 4. Each leg runs chromium,
    # Mobile Chrome and Mobile Safari together, in one Playwright process
    # against its own database, for the spec files
    # scripts/workflow/e2e-shard-files.py assigns it. Sharding by file, not
    # with Playwright's --shard, keeps all three browsers of a spec on one
    # database — the cross-project seeded-state check this job exists for
    # (pinpoint-e2e skill, PP-168u). --shard splits in project order and would
    # put each browser on a different leg. Before the split one runner ran
    # Smoke then Full serially, ~35 minutes of tests; the validation run on
    # #2421 took 7-13 minutes of tests per leg, and Smoke 1/2 is the long pole
    # because responsive-overflow.spec.ts is one file of 117 tests. (PP-yva7.3.)
    # ==============================================================================
    # A plain name: GitHub appends the matrix values ("(smoke, 1, 2)"), and this
    # job is skipped on every PR, where a matrix expression in the name would
    # show unexpanded.
    name: E2E Comprehensive Tests (Post-Merge)
    runs-on: ubuntu-latest
    # Explicit code/deps guard mirrors the two PR E2E siblings. It is the
    # only thing keeping this job off docs-only main pushes: like them it
    # needs only `changes`, so no skipped upstream job cascades a skip. (PP-x0ke.)
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.changes.outputs.code == 'true' || needs.changes.outputs.deps == 'true') }}
    needs: changes
    # Backstop only — the real limit is the Playwright step's own timeout (see
    # the comment there). Must stay above setup + that timeout, or a job
    # cancellation silently swallows the verdict again. (PP-jxhy.)
    #
    # 35 minutes of step budget (5 to select files, 30 to run) leaves 25 for
    # setup. Sized for the COLD-cache
    # case, not the warm one: the node_modules cache keys on the lockfile, so
    # every dependency bump that lands on main — the most frequent push there
    # is — misses it and the leg pays `pnpm install --frozen-lockfile`, plus a
    # full chromium+webkit browser download whenever that bump moves
    # Playwright itself.
    timeout-minutes: 60
    # Job-level so the shard-selection `--list` loads the suite with the same
    # environment as the run; a spec that reads one of these at load time
    # would otherwise be weighed, or listed, differently from how it runs.
    env:
      CONFIG: playwright.config.${{ matrix.suite }}.ts
      MOCK_BLOB_STORAGE: "true"
      UNSUBSCRIBE_SIGNING_SECRET: "ci-test-only-not-a-real-secret-0000000000000000000000000000000000"
    strategy:
      # Every leg must report: one red leg must not cancel the others and
      # leave their parts of main's verdict unknown.
      fail-fast: false
      matrix:
        include:
          - suite: smoke
            shard: 1
            total: 2
          - suite: smoke
            shard: 2
            total: 2
          - suite: full
            shard: 1
            total: 4
          - suite: full
            shard: 2
            total: 4
          - suite: full
            shard: 3
            total: 4
          - suite: full
            shard: 4
            total: 4
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # ratchet:step-security/harden-runner@v2.22.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup locked mise toolchain
        id: toolchain
        uses: $/.github/actions/setup-mise
        with:
          install-args: "--locked node pnpm supabase"

      - name: Restore node_modules
        id: cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # ratchet:actions/cache/restore@v6.1.0
        with:
          path: node_modules
          key: ${{ steps.toolchain.outputs.node-modules-key }}

      - name: Install dependencies (if cache miss)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      # Always, even on a cache hit: the cache holds browser binaries, not the
      # apt packages WebKit needs. Installed once here, so the setup action
      # skips its own --with-deps on a miss.
      - name: Install Playwright system dependencies
        run: pnpm exec playwright install-deps chromium webkit

      - name: Setup Playwright browsers
        uses: $/.github/actions/setup-playwright
        with:
          browsers: chromium webkit
          with-deps: "false"
          # One leg saves; the others would race to upload the same key.
          save-cache: ${{ matrix.suite == 'full' && matrix.shard == 1 }}

      - name: Setup Supabase
        uses: $/.github/actions/setup-supabase

      # Main's migration check. Setup Supabase has just applied every
      # migration to a fresh database; this checks the drizzle/meta chain.
      # (On a PR, the E2E Full job runs it.)
      - name: Verify migration metadata integrity
        if: matrix.suite == 'full' && matrix.shard == 1
        run: pnpm run check:migrations

      # Lists the suite with the same config and projects the run uses, so the
      # assignment covers exactly the files the run would load. Every leg
      # computes the same assignment, so the legs partition the suite. Not
      # continue-on-error: a leg that cannot pick its files has no verdict and
      # must fail. After Setup Supabase because spec support modules read its
      # environment at import (e2e/support/supabase-admin.ts throws without it).
      - name: Select this shard's spec files
        timeout-minutes: 5
        env:
          SHARD: ${{ matrix.shard }}/${{ matrix.total }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/e2e-list.json
        run: |
          # --list exits non-zero on a spec load error; the shard script prints
          # those errors from the report, so run it before failing on status.
          list_status=0
          pnpm exec playwright test --config="$CONFIG" \
            --project=chromium --project="Mobile Chrome" \
            --project="Mobile Safari" --list --reporter=json >/dev/null || list_status=$?
          python3 scripts/workflow/e2e-shard-files.py \
            "$RUNNER_TEMP/e2e-list.json" "$SHARD" >"$RUNNER_TEMP/e2e-shard.txt"
          if [ "$list_status" -ne 0 ]; then
            echo "::error::playwright --list exited $list_status"
            exit "$list_status"
          fi
          cat "$RUNNER_TEMP/e2e-shard.txt"

      # The Playwright step carries its OWN timeout-minutes, deliberately.
      # A job-level timeout cancels the job outright: the evaluate step never
      # runs, and the run reports `cancelled` — which reads as "superseded by a
      # newer push" rather than "main is broken". That is exactly how run
      # 31430839981 hid ten real failures. A step-level timeout paired with
      # `continue-on-error: true` instead marks the step failed and lets the
      # job carry on to its verdict. The job timeout above is only a backstop
      # and must stay comfortably above this one. (PP-jxhy.) 30 minutes, not
      # the ~13 a green leg takes: on a red main every failure costs a locator
      # timeout plus retries (120s and 3 retries on Mobile Safari), and a leg
      # that times out reports no verdict at all.
      #
      # continue-on-error is also what keeps Mobile Safari non-gating: a red
      # WebKit spec fails this step, and the evaluate step below decides.
      - name: Run Comprehensive ${{ matrix.suite }} Tests (all browsers)
        continue-on-error: true
        timeout-minutes: 30
        env:
          # Production server: the webServer runs `next build && next start`
          # inside this step, after Setup Supabase exported the NEXT_PUBLIC_*
          # values the build inlines. See playwright.config.ts (PP-izj5).
          PLAYWRIGHT_WEB_SERVER: "start"
          PLAYWRIGHT_STDOUT: "pipe"
          PLAYWRIGHT_STDERR: "pipe"
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report/results.json
        run: |
          rm -f playwright-report/results.json
          pnpm exec playwright test --config="$CONFIG" \
            --project=chromium --project="Mobile Chrome" \
            --project="Mobile Safari" --workers=3 \
            --test-list "$RUNNER_TEMP/e2e-shard.txt"

      # The only step that fails the leg on test results. A missing report, an
      # empty or all-skipped run, run-level errors, and an assigned file
      # missing from the report all fail it, not just red gating specs
      # (evaluate-e2e-results.sh header).
      - name: Evaluate gating browser results
        env:
          LABEL: ${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.total }}
        run: bash scripts/workflow/evaluate-e2e-results.sh "$LABEL" playwright-report/results.json "$RUNNER_TEMP/e2e-shard.txt"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # ratchet:actions/upload-artifact@v7.0.2
        with:
          name: playwright-report-comprehensive-${{ matrix.suite }}-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  # ==============================================================================
  # CI Gate (Aggregator) — the only required check.
  #
  # Fails if any job it needs failed or was cancelled; `skipped` passes.
  #   - Path-filtered jobs skip on docs-only PRs, and test-e2e-comprehensive
  #     skips on pull_request events, so `skipped` must pass.
  #   - `cancelled` fails because a job that hits its timeout-minutes reports
  #     `cancelled` — a hung E2E run must not leave the gate green (PP-jxhy).
  #   - `changes` is listed so a failure there, which skips the jobs that
  #     need it, cannot pass as a skip.
  #
  # On push to main this also carries the post-merge full-matrix verdict
  # (test-e2e-comprehensive, PP-x0ke): a red or hung run turns CI Gate red on
  # the main commit. It cannot block a merge; it is the alarm.
  # ==============================================================================
  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - changes
      - static
      - linters
      - test-integration
      - test-e2e-smoke
      - test-e2e-full-chromium
      - test-e2e-comprehensive
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # ratchet:step-security/harden-runner@v2.22.2
        with:
          egress-policy: audit

      - name: Fail on any failed or cancelled job
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "::error::A required job failed or was cancelled (a timeout reports as cancelled)."
          echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "  \(.key): \(.value.result)"'
          exit 1

      - name: All jobs passed or were skipped
        run: echo "All required jobs passed or were skipped."
