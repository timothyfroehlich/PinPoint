  test-e2e-comprehensive:
    # ==============================================================================
    # E2E Comprehensive Tests (Post-Merge)
    #
    # Runs the full E2E suite across all browsers after merging to main.
    # Not a required check for PR merge — runs only on push to main.
    # ==============================================================================
    name: E2E Comprehensive Tests (Post-Merge)
    runs-on: ubuntu-latest
    # Explicit code/deps guard mirrors the three PR E2E siblings, rather than
    # leaning on the `setup`-skip cascade to keep it off docs-only main pushes —
    # an implicit guard a future refactor could break. (PP-x0ke.)
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.changes.outputs.code == 'true' || needs.changes.outputs.deps == 'true') }}
    needs: [changes, setup, typecheck, lint, format, linters, test-unit, test-integration, test-migrations]
    # Backstop only — the real limits are per-step (see the comment above the
    # Playwright steps). Must stay above setup + both step timeouts, or a job
    # cancellation silently swallows the verdict again. (PP-jxhy.)
    #
    # 25 + 40 of step budget = 65, so this leaves 25 minutes for setup. Sized
    # for the COLD-cache case, not the warm one: both caches key on
    # `hashFiles('pnpm-lock.yaml')`, so every dependency bump that lands on
    # main — the most frequent push there is — misses both and the job pays
    # `pnpm install --frozen-lockfile` plus a full chromium+webkit browser
    # download, realistically 8-12 minutes against ~2.5 warm.
    timeout-minutes: 90
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # ratchet:step-security/harden-runner@v2.20.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Reserve Supabase ports
        uses: ./.github/actions/reserve-supabase-ports

      - name: Setup pnpm
        uses: pnpm/action-setup@c5ba7f7862a0f64c1b1a05fbac13e0b8e86ba08c  # ratchet:pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # ratchet:actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Restore node_modules
        id: cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # ratchet:actions/cache/restore@v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies (if cache miss)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520  # ratchet:supabase/setup-cli@v3.0.0
        with:
          # Pinned Supabase CLI — bump deliberately (was: latest). PP-d5zn.
          version: 2.113.0

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # ratchet:actions/cache@v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-all-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-all-
            ${{ runner.os }}-playwright-chromium-

      - name: Install Playwright system dependencies (WebKit)
        run: pnpm exec playwright install-deps webkit

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Setup Supabase
        uses: ./.github/actions/setup-supabase

      # Each Playwright step carries its OWN timeout-minutes, deliberately.
      # A job-level timeout cancels the job outright: the evaluate step never
      # runs, and the run reports `cancelled` — which reads as "superseded by a
      # newer push" rather than "main is broken". That is exactly how run
      # 31430839981 hid ten real failures. A step-level timeout paired with
      # `continue-on-error: true` instead marks the step failed and lets the
      # job carry on to its verdict. The job timeout below is only a backstop
      # and must stay comfortably above the sum of these. (PP-jxhy.)
      #
      # Budget, measured on run 31430839981: setup ~2.5m, smoke ~13m,
      # full ~24m on a green main (it burned 30m unfinished on a red one,
      # because each failure costs a 30s locator timeout plus retries).
      - name: Run Comprehensive Smoke Tests (all browsers)
        continue-on-error: true
        timeout-minutes: 25
        env:
          MOCK_BLOB_STORAGE: "true"
          PLAYWRIGHT_STDOUT: "pipe"
          PLAYWRIGHT_STDERR: "pipe"
          # Per-run filename, NOT a shared results.json. The reporter writes
          # once at the end, so a run that dies leaves the PREVIOUS run's file
          # in place and the next evaluate step reads it as its own verdict —
          # a false green. Distinct paths make "missing" unambiguous.
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report/results-smoke.json
          UNSUBSCRIBE_SIGNING_SECRET: "ci-test-only-not-a-real-secret-0000000000000000000000000000000000"
        run: |
          rm -f playwright-report/results-smoke.json
          pnpm exec playwright test --config=playwright.config.smoke.ts \
            --project=chromium --project="Mobile Chrome" \
            --project="Mobile Safari" --workers=3

      # Copied out because the Full run's HTML reporter calls removeFolders()
      # on `playwright-report/` in its own onEnd, wiping everything the Smoke
      # run left there. The verdict itself is unaffected — Smoke is evaluated
      # below, before Full starts — but without this the uploaded artifact
      # would contain no trace of the Smoke run at all.
      - name: Preserve Smoke report
        if: always()
        run: |
          mkdir -p e2e-verdicts
          cp playwright-report/results-smoke.json e2e-verdicts/ 2>/dev/null || \
            echo "no smoke report to preserve"

      # Both evaluate steps are continue-on-error so that a gating Smoke
      # failure does not abort the job before Full ever runs. Letting the
      # script's `exit 1` end the step here would mean one red smoke spec
      # leaves main's full-suite health unknown for that commit — the same
      # class of missing verdict this PR exists to remove. The dedicated gate
      # step after both suites is what actually fails the job.
      - name: Evaluate gating browser results (Smoke)
        id: verdict-smoke
        continue-on-error: true
        run: bash scripts/workflow/evaluate-e2e-results.sh Smoke playwright-report/results-smoke.json

      - name: Run Comprehensive Full Tests (all browsers)
        continue-on-error: true
        timeout-minutes: 40
        env:
          MOCK_BLOB_STORAGE: "true"
          PLAYWRIGHT_STDOUT: "pipe"
          PLAYWRIGHT_STDERR: "pipe"
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report/results-full.json
          UNSUBSCRIBE_SIGNING_SECRET: "ci-test-only-not-a-real-secret-0000000000000000000000000000000000"
        run: |
          rm -f playwright-report/results-full.json
          pnpm exec playwright test --config=playwright.config.full.ts \
            --project=chromium --project="Mobile Chrome" \
            --project="Mobile Safari" --workers=3

      - name: Evaluate gating browser results (Full)
        id: verdict-full
        continue-on-error: true
        run: bash scripts/workflow/evaluate-e2e-results.sh Full playwright-report/results-full.json

      # The only step that fails the job. Both suites have produced a verdict
      # by now, so a red Smoke and a red Full are both visible on the same run
      # instead of the first one hiding the second.
      - name: Gate on E2E verdicts
        if: steps.verdict-smoke.outcome == 'failure' || steps.verdict-full.outcome == 'failure'
        run: |
          echo "::error::E2E comprehensive: Smoke=${{ steps.verdict-smoke.outcome }} Full=${{ steps.verdict-full.outcome }} — see the evaluate steps above."
          exit 1

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: playwright-report-comprehensive
          path: |
            playwright-report/
            e2e-verdicts/
          retention-days: 7

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # ratchet:step-security/harden-runner@v2.20.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # ratchet:gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pnpm-audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # ratchet:step-security/harden-runner@v2.20.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@c5ba7f7862a0f64c1b1a05fbac13e0b8e86ba08c  # ratchet:pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # ratchet:actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Restore node_modules
        id: cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # ratchet:actions/cache/restore@v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies (if cache miss)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # PR head commit on pull_request events (github.sha is the ephemeral
          # merge commit there); the pushed commit on push events.
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          registry_errors="ERR_PNPM_AUDIT_BAD_RESPONSE"
          registry_errors+="|ERR_PNPM_AUDIT_REGISTRY"
          registry_errors+="|ECONNREFUSED|EAI_AGAIN|ETIMEDOUT"
          output=$(pnpm audit --audit-level=high 2>&1) || {
            if echo "$output" | grep -qE "$registry_errors"; then
              echo "::warning::pnpm audit skipped: registry error"
              echo "$output"
              exit 0
            fi
            echo "$output"
            # Per-PR escape hatch: a maintainer may bypass this gate for the
            # current commit via `/audit-override <reason>` (see
            # .github/workflows/audit-override.yaml). The override is a commit
            # status bound to HEAD_SHA, so it never carries to a new commit —
            # a newly-introduced advisory is never silently masked.
            if bash scripts/workflow/audit-override/gate.sh check "$HEAD_SHA"; then
              echo "::warning::pnpm audit bypassed by an active /audit-override on ${HEAD_SHA}. See the audit-override sticky comment for who/why."
              exit 0
            fi
            echo "::error::pnpm audit found advisories at or above 'high'. Fix them, or a maintainer can bypass for this PR with '/audit-override <reason>'."
            exit 1
          }
          echo "$output"

  # ==============================================================================
  # CI Gate (Aggregator)
  #
  # Two tiers of required jobs:
  #
  #   1. ALWAYS-RUNS (must succeed): linters, gitleaks
  #      These run on every PR including docs-only changes. Their `success` is
  #      strictly required - failure or cancellation fails the gate.
  #
  #   2. PATH-FILTERED (optional outcomes): build, lint, format, typecheck,
  #      test-*, pnpm-audit
  #      These only run when source changes. On docs-only PRs they cascade-skip
  #      because they depend on `setup` which is gated by `changes.outputs.code`.
  #      `skipped` and `cancelled` pass; only `failure` fails the gate.
  #
  # Why allow `cancelled`?
  #   - Cascade-skips from a gated `needs:` chain can surface as `cancelled`
  #     instead of `skipped` depending on how the runner schedules them.
  #   - Concurrency cancel-in-progress (when a new push supersedes an old run)
  #     marks queued jobs `cancelled`. The replacement run becomes the
  #     authoritative status, so it is safe to treat the cancelled run as pass.
  #
  # Post-merge full-matrix alarm (PP-x0ke) — a tier-3 job, see below:
  #   `test-e2e-comprehensive` is push-to-main only (it runs the full E2E matrix
  #   — chromium + Mobile Chrome + Mobile Safari, smoke + full — against one DB,
  #   the only job that covers the Mobile-Chrome/Mobile-Safari a11y specs and
  #   the seed-leak class). On a `pull_request` event it is skipped, and
  #   `skipped` passes, so it never blocks a PR merge (nor could it — it does
  #   not run on PRs, so it cannot be a ruleset-required check without wedging
  #   every PR on a check that never reports). On a push to main it runs, and a
  #   `failure` OR a `cancelled` (its 90-min backstop firing on a hang) now
  #   fails CI Gate — turning a red or hung post-merge full-matrix verdict into
  #   a red required check on the main commit, instead of a green main hiding a
  #   red/hung non-required job. That is the alarm; blocking is impossible
  #   post-merge. It gets its own tier-3 rule precisely because tier 2 passes
  #   `cancelled` and comprehensive must not. Catching a full-matrix-only
  #   regression BEFORE merge would mean running comprehensive on `pull_request`
  #   too (~30 min/PR) — deliberately not done; see PP-x0ke.
  # ==============================================================================
  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - linters
      - gitleaks
      - build
      - lint
      - format
      - typecheck
      - test-unit
      - test-integration
      - test-migrations
      - test-integration-supabase
      - test-e2e-smoke
      - test-e2e-smoke-mobile-chrome
      - test-e2e-full-chromium
      - test-e2e-comprehensive
      - pnpm-audit
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # ratchet:step-security/harden-runner@v2.20.1
        with:
          egress-policy: audit

      - name: Check required job results
        env:
          # Tier 1: always-runs jobs - must be `success`.
          LINTERS_RESULT: ${{ needs.linters.result }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          # Tier 2: path-filtered jobs - `failure` fails the gate;
          # `success`, `skipped`, and `cancelled` all pass.
          BUILD_RESULT: ${{ needs.build.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          FORMAT_RESULT: ${{ needs.format.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          TEST_UNIT_RESULT: ${{ needs.test-unit.result }}
          TEST_INTEGRATION_RESULT: ${{ needs.test-integration.result }}
          TEST_MIGRATIONS_RESULT: ${{ needs.test-migrations.result }}
          TEST_INTEGRATION_SUPABASE_RESULT: ${{ needs.test-integration-supabase.result }}
          TEST_E2E_SMOKE_RESULT: ${{ needs.test-e2e-smoke.result }}
          TEST_E2E_SMOKE_MOBILE_CHROME_RESULT: ${{ needs.test-e2e-smoke-mobile-chrome.result }}
          TEST_E2E_FULL_CHROMIUM_RESULT: ${{ needs.test-e2e-full-chromium.result }}
          # Push-to-main only; skipped (→ pass) on PRs, `failure` fails the gate
          # on main. See the Post-merge full-matrix alarm note above (PP-x0ke).
          TEST_E2E_COMPREHENSIVE_RESULT: ${{ needs.test-e2e-comprehensive.result }}
          PNPM_AUDIT_RESULT: ${{ needs.pnpm-audit.result }}
        run: |
          # Tier 1: always-runs jobs - must be `success`.
          required=("$LINTERS_RESULT" "$GITLEAKS_RESULT")
          for r in "${required[@]}"; do
            if [[ "$r" != "success" ]]; then
              echo "::error::Always-runs job did not succeed (result=$r)"
              exit 1
            fi
          done

          # Tier 2: path-filtered jobs - `failure` fails; `success`, `skipped`,
          # and `cancelled` all pass. Cascade-skips on docs-only PRs and
          # concurrency cancellations are intentional and should not block merge.
          optional=("$BUILD_RESULT" "$LINT_RESULT" \
                    "$FORMAT_RESULT" "$TYPECHECK_RESULT" \
                    "$TEST_UNIT_RESULT" "$TEST_INTEGRATION_RESULT" \
                    "$TEST_MIGRATIONS_RESULT" "$TEST_INTEGRATION_SUPABASE_RESULT" \
                    "$TEST_E2E_SMOKE_RESULT" "$TEST_E2E_SMOKE_MOBILE_CHROME_RESULT" \
                    "$TEST_E2E_FULL_CHROMIUM_RESULT" "$PNPM_AUDIT_RESULT")
          for r in "${optional[@]}"; do
            if [[ "$r" == "failure" ]]; then
              echo "::error::Path-filtered job failed (result=$r)"
              exit 1
            fi
          done

          # Tier 3: test-e2e-comprehensive — like tier 2 but `cancelled` FAILS.
          #
          # The generic tier-2 rule passes `cancelled` so a concurrency-
          # superseded run does not block. That is wrong for comprehensive: its
          # 90-minute job backstop (PP-jxhy) surfaces a HANG — a stuck install,
          # browser download, or runner stall in an untimed phase — as
          # result=cancelled, and the entire point of PP-x0ke is that a hung or
          # red post-merge full-matrix run must not leave a green CI Gate on
          # main. Passing `cancelled` here would reopen that exact silent
          # swallow. So `success` and `skipped` pass (skipped = a PR event or a
          # docs-only main push, where it correctly does not run); everything
          # else — `failure` and `cancelled` — fails the gate.
          #
          # Tradeoff: a manually-cancelled main run now alarms. That is
          # acceptable and arguably correct (someone killed the verdict). It is
          # NOT a false-alarm risk from concurrency: the workflow concurrency
          # group appends github.sha on push (see top of file), so each main
          # commit has its own group and a main run is never cancelled by a
          # later main push. On push, `cancelled` therefore means the backstop
          # (a real hang) or a manual cancel — both of which should alarm.
          case "$TEST_E2E_COMPREHENSIVE_RESULT" in
            success | skipped) ;;
            *)
              echo "::error::Post-merge E2E Comprehensive did not pass (result=$TEST_E2E_COMPREHENSIVE_RESULT)."
              echo "::error::A hung (cancelled) or failed full-matrix run must not leave CI Gate green on main. See PP-x0ke."
              exit 1
              ;;
          esac

          echo "All required jobs passed; path-filtered jobs passed, were skipped, or were cancelled"
