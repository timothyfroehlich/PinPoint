name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - claude/**

permissions: read-all  # zizmor: ignore[excessive-permissions]

# Cancel superseded PR runs; never cancel a push to main.
#
# A PR push supersedes the one before it — same branch, same question, and the
# older answer is worthless — so cancelling saves runners with nothing lost.
# A push to main is the opposite: each one is a distinct commit whose result is
# the thing we want, and `test-e2e-comprehensive` takes ~30 minutes to produce
# it. Under a shared `${{ github.ref }}` group every merge cancelled the
# previous merge's run, so on any evening with more than one merge per half
# hour that job was cancelled far more often than it finished — leaving the
# same silent non-verdict PP-jxhy set out to remove, reached by a different
# route. (Observed on run 31755670441: Smoke evaluated clean, then the Full
# step was cancelled 30 minutes in by two later merges, and both the Full
# evaluate and the gating step skipped.)
#
# Appending the SHA on `push` gives every main commit its own group, so main
# runs neither cancel nor queue behind each other. Pull-request runs keep the
# ref-based group and the old behaviour exactly.
#
# Not job-level `concurrency` on that job: job-level groups govern queueing
# between jobs, they do not exempt a job from the workflow-level cancel. Not
# `cancel-in-progress: false` either — main runs would then serialize, so one
# 30-minute comprehensive job delays the next main run by up to 30 minutes and
# they pile up. (PP-tbhv.)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  # Detect which files changed so non-website PRs skip the expensive jobs
  # (integration, migrations, Supabase, E2E). `static` and `linters` always
  # run, so a hole in this filter can skip E2E but never type-check, lint,
  # unit tests or the build.
  #
  # "Non-website": docs and *.md, .beads, agent configs (.agent[s], .claude,
  # .codex), non-TS/JS files under scripts/ (py/sh/sql/json/txt and
  # scripts/tests/**), editor/git configs, test/linter configs, and the
  # GitHub configs/workflows that don't affect this workflow. TS/JS under
  # scripts/ and package.json count as code (scripts/migrate-production.ts runs
  # on every prod build; PP-9jar). ci.yml and .github/actions/** always count.
  #
  # predicate-quantifier 'every' with a positive '**' plus negative exclusions:
  # a file is "code" only if it is excluded by none of them. New or unknown
  # paths default to running full CI.
  #
  # Why 'every' and not 'some': under 'some', the positive '**' matches every
  # file by itself, short-circuiting the negative exclusions and forcing
  # has_code=true on every PR. PR #1327 / PP-r5v shipped 'some' and the
  # filter never fired (e.g. PR #1386, a single .agent/skills/*.md change,
  # still ran the full E2E suite).
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.set-code.outputs.code }}
      deps: ${{ steps.deps-filter.outputs.deps }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # ratchet:step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # ratchet:dorny/paths-filter@v4.0.3
        with:
          predicate-quantifier: "every"
          filters: |
            has_code:
              - '**'
              - '!docs/**'
              - '!*.md'
              - '!**/*.md'
              - '!.beads/**'
              - '!.agent/**'
              - '!.agents/**'
              - '!.claude/**'
              - '!.codex/**'
              - '!.husky/**'
              - '!.vscode/**'
              - '!pinpoint.code-workspace'
              - '!LICENSE'
              - '!.gitignore'
              - '!.gitattributes'
              - '!pytest.ini'
              - '!ruff.toml'
              - '!.yamllint.yml'
              - '!.gitleaks.toml'
              - '!scripts/**/*.py'
              - '!scripts/**/*.sh'
              - '!scripts/**/*.sql'
              - '!scripts/**/*.json'
              - '!scripts/**/*.txt'
              - '!scripts/tests/**'
              - '!.github/dependabot.yml'
              - '!.github/renovate.json'
              - '!.github/CODEOWNERS'
              - '!.github/workflows/codex-reaction-witness.yaml'
              - '!.github/workflows/ownerless-renovate-issues.yaml'
              - '!.github/workflows/preview-control.yaml'
              - '!.github/workflows/preview-reaper.yaml'
      # Separate filter for dependency changes using default "some" quantifier
      # so deps=true when ANY changed file is a dependency file (not ALL).
      - id: deps-filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # ratchet:dorny/paths-filter@v4.0.3
        with:
          filters: |
            deps:
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
      - name: Determine code changes
        id: set-code
        env:
          HAS_CODE: ${{ steps.filter.outputs.has_code }}
        run: |
          if [ "$HAS_CODE" = "true" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Static checks, unit tests and build. Always runs (no path filter), so a
  # change that only touches files the filter treats as non-code still gets
  # type-checked, linted and unit-tested.
  static:
    name: Static checks, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # ratchet:step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup locked mise toolchain
        id: toolchain
        uses: $/.github/actions/setup-mise
        with:
          install-args: "--locked"

      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # ratchet:actions/cache@v6.1.0
        with:
          path: node_modules
          key: ${{ steps.toolchain.outputs.node-modules-key }}

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: |
          pnpm run typecheck
          pnpm run typecheck:tests
          pnpm run typecheck:e2e

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format

      - name: Unit tests
        run: |
          set -a
          source .env.ci
          set +a
          pnpm run test:_run

      - name: Build application
        run: |
          set -a
          source .env.ci
          set +a
          pnpm run build

  # Setup job caches dependencies for reuse by other jobs
  setup:
    name: Setup Dependencies
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.deps == 'true'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # ratchet:step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup locked mise toolchain
        id: toolchain
        uses: $/.github/actions/setup-mise

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # ratchet:actions/cache@v6.1.0
        with:
          path: node_modules
          key: ${{ steps.toolchain.outputs.node-modules-key }}

  # Fast linters that always run — cheap enough to never skip.
  linters:
    name: Fast Linters
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # ratchet:step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install system linters
        run: |
          sudo apt-get update
          sudo apt-get install -y yamllint shellcheck

      - name: Setup locked Python toolchain
        uses: $/.github/actions/setup-mise
        with:
          install-args: "--locked python ruff zizmor"
          cache-pnpm: "false"

      - name: Install Python test dependencies
        run: python3 -m pip install -r scripts/requirements.txt

      - name: YAML lint
        run: yamllint .

      - name: Check skill frontmatter
        run: python3 scripts/check_skill_frontmatter.py

      # actionlint reads .github/actionlint.yaml, which ignores the
      # self-repository `uses: $/...` references until rhysd/actionlint#711.
      - name: Action lint
        env:
          ACTIONLINT_VERSION: "1.7.11"
        run: |
          dl="https://raw.githubusercontent.com/rhysd/actionlint"
          dl="${dl}/main/scripts/download-actionlint.bash"
          bash <(curl -sL "$dl") "$ACTIONLINT_VERSION"
          find .github/workflows \( -name '*.yml' -o -name '*.yaml' \) \
            ! -name '*.lock.yml' -print0 | xargs -0 ./actionlint

      - name: Ruff check
        run: ruff check scripts/

      - name: Ruff format check
        run: ruff format --check scripts/

      - name: Pytest (scripts)
        run: python3 -m pytest scripts/tests/

      - name: Check E2E spec locations
        run: python3 scripts/check_e2e_spec_locations.py

      - name: ShellCheck
        run: find scripts/ .claude/hooks/ -name '*.sh' -print0 | xargs -0 shellcheck

      - name: Zizmor (GitHub Actions security)
        run: |
          find .github/workflows \( -name '*.yml' -o -name '*.yaml' \) \
            ! -name '*.lock.yml' -print0 \
            | xargs -0 zizmor --min-severity low --format plain \
                .github/actions/setup-mise/action.yml

      - name: Ratchet Check (pinned actions)
        uses: sethvargo/ratchet@a7ead07a89972fef4316ad196af18f87ac77bb97  # ratchet:sethvargo/ratchet@main
        with:
          files: |
            .github/actions/setup-mise/action.yml
            .github/workflows/ci.yml
            .github/workflows/preview-control.yaml
            .github/workflows/preview-reaper.yaml

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # ratchet:step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup locked mise toolchain
        id: toolchain
        uses: $/.github/actions/setup-mise

      - name: Restore node_modules
        id: cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # ratchet:actions/cache/restore@v6.1.0
        with:
          path: node_modules
          key: ${{ steps.toolchain.outputs.node-modules-key }}

      - name: Install dependencies (if cache miss)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Run integration tests
        run: |
          set -a
          source .env.ci
          set +a
          pnpm run test:integration

  # ==============================================================================
  # Migration Verification
  #
  # Validates that Drizzle migrations can apply cleanly to a fresh database.
  # Uses Supabase CLI since migrations reference auth.users (Supabase-specific).
  # This catches broken migrations before they reach production.
  # ==============================================================================
  test-migrations:
    name: Verify Migrations
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # ratchet:step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup locked mise toolchain
        id: toolchain
        uses: $/.github/actions/setup-mise
        with:
          install-args: "--locked node pnpm supabase"

      - name: Restore node_modules
        id: cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # ratchet:actions/cache/restore@v6.1.0
        with:
          path: node_modules
          key: ${{ steps.toolchain.outputs.node-modules-key }}

      - name: Install dependencies (if cache miss)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase
        uses: $/.github/actions/setup-supabase
        with:
          seed: "false"

      - name: Apply migrations to fresh database
        run: pnpm run db:migrate

      - name: Verify migration metadata integrity
        run: pnpm run check:migrations

      - name: Ensure test schema is current
        run: |
          set -a
          source .env.ci
          set +a
          pnpm run test:ensure-schema

  # The Supabase integration and E2E jobs need only `changes`, so they start
  # within a minute of the run instead of after static, integration and
  # migrations finish (~5 minutes in). They install dependencies themselves on
  # a node_modules cache miss, so they never depended on `setup`'s output.
  # Nothing passes unchecked: CI Gate still needs every job. The cost is runner
  # time spent on E2E in a run that static goes on to fail. (PP-yva7.1.)
  test-integration-supabase:
    name: Supabase Integration Tests
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && (needs.changes.outputs.code == 'true' || needs.changes.outputs.deps == 'true') }}
    needs: changes
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # ratchet:step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup locked mise toolchain
        id: toolchain
        uses: $/.github/actions/setup-mise
        with:
          install-args: "--locked node pnpm supabase"

      - name: Restore node_modules
        id: cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # ratchet:actions/cache/restore@v6.1.0
        with:
          path: node_modules
          key: ${{ steps.toolchain.outputs.node-modules-key }}

      - name: Install dependencies (if cache miss)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase
        uses: $/.github/actions/setup-supabase

      - name: Run Supabase integration tests
        run: pnpm run test:integration:supabase

  test-e2e-smoke:
    # ==============================================================================
    # E2E Smoke Tests (Chromium Only)
    #
    # Runs smoke tests with chromium browser only for fast feedback.
    #
    # This and its two PR siblings each split into 2 Playwright shards
    # (`--shard`); GitHub appends the shard number to the job name. The name
    # itself stays a plain string, because a skipped matrix job never expands its
    # matrix and would show the raw expression. The smoke jobs use
    # playwright.config.ts, which sets fullyParallel, so smoke splits by test and
    # comes out even (51/51 tests; ~200s per shard against ~420s unsplit).
    # playwright.config.full.ts does not, so Full splits by file and runs uneven
    # (62/57 tests, 396s/267s on the first run). Each shard runs auth-setup itself
    # and gets its own database. Every extra shard pays ~2 minutes of job setup
    # and the dev server's first-compile cost again, and takes another slot under
    # the account's concurrent-job cap. (PP-yva7.2.)
    # ==============================================================================
    name: E2E Smoke Tests (Chromium)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && (needs.changes.outputs.code == 'true' || needs.changes.outputs.deps == 'true') }}
    needs: changes
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # ratchet:step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup locked mise toolchain
        id: toolchain
        uses: $/.github/actions/setup-mise
        with:
          install-args: "--locked node pnpm supabase"

      - name: Restore node_modules
        id: cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # ratchet:actions/cache/restore@v6.1.0
        with:
          path: node_modules
          key: ${{ steps.toolchain.outputs.node-modules-key }}

      - name: Install dependencies (if cache miss)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Setup Playwright browsers
        uses: $/.github/actions/setup-playwright
        with:
          browsers: chromium

      - name: Setup Supabase
        uses: $/.github/actions/setup-supabase

      - name: Run Smoke Tests (Chromium)
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          MOCK_BLOB_STORAGE: "true"
          PLAYWRIGHT_STDOUT: "pipe"
          PLAYWRIGHT_STDERR: "pipe"
          UNSUBSCRIBE_SIGNING_SECRET: "ci-test-only-not-a-real-secret-0000000000000000000000000000000000"
        run: pnpm exec playwright test e2e/smoke --project=chromium --shard="$SHARD"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: playwright-report-smoke-chromium-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  test-e2e-smoke-mobile-chrome:
    # ==============================================================================
    # E2E Smoke Tests (Mobile Chrome)
    #
    # Runs smoke tests with Mobile Chrome browser to catch mobile-specific issues.
    # ==============================================================================
    name: E2E Smoke Tests (Mobile Chrome)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && (needs.changes.outputs.code == 'true' || needs.changes.outputs.deps == 'true') }}
    needs: changes
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # ratchet:step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup locked mise toolchain
        id: toolchain
        uses: $/.github/actions/setup-mise
        with:
          install-args: "--locked node pnpm supabase"

      - name: Restore node_modules
        id: cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # ratchet:actions/cache/restore@v6.1.0
        with:
          path: node_modules
          key: ${{ steps.toolchain.outputs.node-modules-key }}

      - name: Install dependencies (if cache miss)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Setup Playwright browsers
        uses: $/.github/actions/setup-playwright
        with:
          browsers: chromium

      - name: Setup Supabase
        uses: $/.github/actions/setup-supabase

      - name: Run Smoke Tests (Mobile Chrome)
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          MOCK_BLOB_STORAGE: "true"
          PLAYWRIGHT_STDOUT: "pipe"
          PLAYWRIGHT_STDERR: "pipe"
          UNSUBSCRIBE_SIGNING_SECRET: "ci-test-only-not-a-real-secret-0000000000000000000000000000000000"
        run: pnpm exec playwright test e2e/smoke --project="Mobile Chrome" --shard="$SHARD"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: playwright-report-smoke-mobile-chrome-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  test-e2e-full-chromium:
    # ==============================================================================
    # E2E Full Tests (Chromium)
    #
    # Runs full test suite with chromium browser.
    # ==============================================================================
    name: E2E Full Tests (Chromium)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && (needs.changes.outputs.code == 'true' || needs.changes.outputs.deps == 'true') }}
    needs: changes
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # ratchet:step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup locked mise toolchain
        id: toolchain
        uses: $/.github/actions/setup-mise
        with:
          install-args: "--locked node pnpm supabase"

      - name: Restore node_modules
        id: cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # ratchet:actions/cache/restore@v6.1.0
        with:
          path: node_modules
          key: ${{ steps.toolchain.outputs.node-modules-key }}

      - name: Install dependencies (if cache miss)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Setup Playwright browsers
        uses: $/.github/actions/setup-playwright
        with:
          browsers: chromium

      - name: Setup Supabase
        uses: $/.github/actions/setup-supabase

      - name: Run Full Tests (Chromium)
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          MOCK_BLOB_STORAGE: "true"
          PLAYWRIGHT_STDOUT: "pipe"
          PLAYWRIGHT_STDERR: "pipe"
          UNSUBSCRIBE_SIGNING_SECRET: "ci-test-only-not-a-real-secret-0000000000000000000000000000000000"
        run: pnpm exec playwright test --config=playwright.config.full.ts --project=chromium --shard="$SHARD"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: playwright-report-full-chromium-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  test-e2e-comprehensive:
    # ==============================================================================
    # E2E Comprehensive Tests (Post-Merge)
    #
    # Runs the full E2E suite across all browsers after merging to main.
    # Not a required check for PR merge — runs only on push to main.
    #
    # Six parallel legs: Smoke in 2 shards, Full in 4. Each leg runs chromium,
    # Mobile Chrome and Mobile Safari together, in one Playwright process
    # against its own database, for the spec files
    # scripts/workflow/e2e-shard-files.py assigns it. Sharding by file, not
    # with Playwright's --shard, keeps all three browsers of a spec on one
    # database — the cross-project seeded-state check this job exists for
    # (pinpoint-e2e skill, PP-168u). --shard splits in project order and would
    # put each browser on a different leg. Before the split one runner ran
    # Smoke then Full serially, ~35 minutes of tests; the validation run on
    # #2421 took 7-13 minutes of tests per leg, and Smoke 1/2 is the long pole
    # because responsive-overflow.spec.ts is one file of 117 tests. (PP-yva7.3.)
    # ==============================================================================
    # A plain name: GitHub appends the matrix values ("(smoke, 1, 2)"), and this
    # job is skipped on every PR, where a matrix expression in the name would
    # show unexpanded.
    name: E2E Comprehensive Tests (Post-Merge)
    runs-on: ubuntu-latest
    # Explicit code/deps guard mirrors the three PR E2E siblings. It is the
    # only thing keeping this job off docs-only main pushes: like them it
    # needs only `changes`, so no skipped upstream job cascades a skip. (PP-x0ke.)
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.changes.outputs.code == 'true' || needs.changes.outputs.deps == 'true') }}
    needs: changes
    # Backstop only — the real limit is the Playwright step's own timeout (see
    # the comment there). Must stay above setup + that timeout, or a job
    # cancellation silently swallows the verdict again. (PP-jxhy.)
    #
    # 20 minutes of step budget leaves 25 for setup. Sized for the COLD-cache
    # case, not the warm one: the node_modules cache keys on the lockfile, so
    # every dependency bump that lands on main — the most frequent push there
    # is — misses it and the leg pays `pnpm install --frozen-lockfile`, plus a
    # full chromium+webkit browser download whenever that bump moves
    # Playwright itself.
    timeout-minutes: 45
    strategy:
      # Every leg must report: one red leg must not cancel the others and
      # leave their parts of main's verdict unknown.
      fail-fast: false
      matrix:
        include:
          - suite: smoke
            shard: 1
            total: 2
          - suite: smoke
            shard: 2
            total: 2
          - suite: full
            shard: 1
            total: 4
          - suite: full
            shard: 2
            total: 4
          - suite: full
            shard: 3
            total: 4
          - suite: full
            shard: 4
            total: 4
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # ratchet:step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup locked mise toolchain
        id: toolchain
        uses: $/.github/actions/setup-mise
        with:
          install-args: "--locked node pnpm supabase"

      - name: Restore node_modules
        id: cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # ratchet:actions/cache/restore@v6.1.0
        with:
          path: node_modules
          key: ${{ steps.toolchain.outputs.node-modules-key }}

      - name: Install dependencies (if cache miss)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      # Always, even on a cache hit: the cache holds browser binaries, not the
      # apt packages WebKit needs. Installed once here, so the setup action
      # skips its own --with-deps on a miss.
      - name: Install Playwright system dependencies
        run: pnpm exec playwright install-deps chromium webkit

      - name: Setup Playwright browsers
        uses: $/.github/actions/setup-playwright
        with:
          browsers: chromium webkit
          with-deps: "false"
          save-cache: "true"

      - name: Setup Supabase
        uses: $/.github/actions/setup-supabase

      # Lists the suite with the same config and projects the run uses, so the
      # assignment covers exactly the files the run would load. Every leg
      # computes the same assignment, so the legs partition the suite. Not
      # continue-on-error: a leg that cannot pick its files has no verdict and
      # must fail.
      - name: Select this shard's spec files
        env:
          CONFIG: playwright.config.${{ matrix.suite }}.ts
          SHARD: ${{ matrix.shard }}/${{ matrix.total }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/e2e-list.json
        run: |
          pnpm exec playwright test --config="$CONFIG" \
            --project=chromium --project="Mobile Chrome" \
            --project="Mobile Safari" --list --reporter=json >/dev/null
          python3 scripts/workflow/e2e-shard-files.py \
            "$RUNNER_TEMP/e2e-list.json" "$SHARD" >"$RUNNER_TEMP/e2e-shard.txt"
          cat "$RUNNER_TEMP/e2e-shard.txt"

      # The Playwright step carries its OWN timeout-minutes, deliberately.
      # A job-level timeout cancels the job outright: the evaluate step never
      # runs, and the run reports `cancelled` — which reads as "superseded by a
      # newer push" rather than "main is broken". That is exactly how run
      # 31430839981 hid ten real failures. A step-level timeout paired with
      # `continue-on-error: true` instead marks the step failed and lets the
      # job carry on to its verdict. The job timeout above is only a backstop
      # and must stay comfortably above this one. (PP-jxhy.)
      #
      # continue-on-error is also what keeps Mobile Safari non-gating: a red
      # WebKit spec fails this step, and the evaluate step below decides.
      - name: Run Comprehensive ${{ matrix.suite }} Tests (all browsers)
        continue-on-error: true
        timeout-minutes: 20
        env:
          CONFIG: playwright.config.${{ matrix.suite }}.ts
          MOCK_BLOB_STORAGE: "true"
          PLAYWRIGHT_STDOUT: "pipe"
          PLAYWRIGHT_STDERR: "pipe"
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report/results.json
          UNSUBSCRIBE_SIGNING_SECRET: "ci-test-only-not-a-real-secret-0000000000000000000000000000000000"
        run: |
          rm -f playwright-report/results.json
          pnpm exec playwright test --config="$CONFIG" \
            --project=chromium --project="Mobile Chrome" \
            --project="Mobile Safari" --workers=3 \
            --test-list "$RUNNER_TEMP/e2e-shard.txt"

      # The only step that fails the leg on test results. A missing report, an
      # empty or all-skipped run, and run-level errors all fail it, not just
      # red gating specs (evaluate-e2e-results.sh header).
      - name: Evaluate gating browser results
        env:
          LABEL: ${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.total }}
        run: bash scripts/workflow/evaluate-e2e-results.sh "$LABEL" playwright-report/results.json

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: playwright-report-comprehensive-${{ matrix.suite }}-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # ratchet:step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # ratchet:gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pnpm-audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    needs: changes
    # Fails only on high/critical advisories the change adds over its base.
    # One published against a version already locked on main is Dependabot's
    # job (dependabot.yml security updates) and must not block unrelated
    # dependency PRs.
    if: needs.changes.outputs.deps == 'true'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # ratchet:step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # the base commit's lockfile

      - name: Setup locked mise toolchain
        uses: $/.github/actions/setup-mise

      # pnpm audit reads the lockfile only; no node_modules needed. `--dir`
      # keeps pnpm's mise shim resolving from the checkout.
      - name: Run pnpm audit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Writes "<id> <package>: <title>" per high/critical advisory in the
          # lockfile at $1 to $RUNNER_TEMP/$2.ids; fails when there is no report.
          audit() {
            local out="$RUNNER_TEMP/$2"
            pnpm --dir "$1" --pm-on-fail=ignore audit --json >"$out.json" 2>"$out.err" || true
            jq -e '.advisories | type == "object"' "$out.json" >/dev/null 2>&1 || return 1
            jq -r '.advisories | to_entries[]
              | select(.value.severity == "high" or .value.severity == "critical")
              | "\(.key) \(.value.module_name): \(.value.title)"' "$out.json" >"$out.ids"
          }

          if ! audit . head; then
            cat "$RUNNER_TEMP/head.json" "$RUNNER_TEMP/head.err"
            registry_errors="ERR_PNPM_AUDIT_BAD_RESPONSE|ERR_PNPM_AUDIT_REGISTRY"
            registry_errors+="|ECONNREFUSED|EAI_AGAIN|ETIMEDOUT"
            if grep -qE "$registry_errors" "$RUNNER_TEMP/head.json" "$RUNNER_TEMP/head.err"; then
              echo "::warning::pnpm audit skipped: registry error"
              exit 0
            fi
            echo "::error::pnpm audit produced no report."
            exit 1
          fi

          base="$RUNNER_TEMP/base"
          mkdir -p "$base"
          for f in package.json pnpm-lock.yaml pnpm-workspace.yaml; do
            git show "$BASE_SHA:$f" >"$base/$f" 2>/dev/null || rm -f "$base/$f"
          done
          if ! audit "$base" base; then
            echo "::warning::Could not audit the base lockfile; every advisory counts as new."
            : >"$RUNNER_TEMP/base.ids"
          fi

          new=$(awk 'FILENAME == ARGV[1] { seen[$1]; next } !($1 in seen)' \
            "$RUNNER_TEMP/base.ids" "$RUNNER_TEMP/head.ids")
          if [[ -s "$RUNNER_TEMP/base.ids" ]]; then
            echo "Already on the base (Dependabot's job):"
            cat "$RUNNER_TEMP/base.ids"
          fi
          if [[ -n "$new" ]]; then
            echo "::error::This change adds high/critical advisories:"
            echo "$new"
            exit 1
          fi
          echo "No high/critical advisories added over the base."

  # ==============================================================================
  # CI Gate (Aggregator) — the only required check.
  #
  # Fails if any job it needs failed or was cancelled; `skipped` passes.
  #   - Path-filtered jobs skip on docs-only PRs, and test-e2e-comprehensive
  #     skips on pull_request events, so `skipped` must pass.
  #   - `cancelled` fails because a job that hits its timeout-minutes reports
  #     `cancelled` — a hung E2E run must not leave the gate green (PP-jxhy).
  #   - `changes` and `setup` are listed so a failure there, which skips the
  #     jobs that need it, cannot pass as a skip.
  #
  # On push to main this also carries the post-merge full-matrix verdict
  # (test-e2e-comprehensive, PP-x0ke): a red or hung run turns CI Gate red on
  # the main commit. It cannot block a merge; it is the alarm.
  # ==============================================================================
  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - changes
      - setup
      - static
      - linters
      - gitleaks
      - test-integration
      - test-migrations
      - test-integration-supabase
      - test-e2e-smoke
      - test-e2e-smoke-mobile-chrome
      - test-e2e-full-chromium
      - test-e2e-comprehensive
      - pnpm-audit
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # ratchet:step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - name: Fail on any failed or cancelled job
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "::error::A required job failed or was cancelled (a timeout reports as cancelled)."
          echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "  \(.key): \(.value.result)"'
          exit 1

      - name: All jobs passed or were skipped
        run: echo "All required jobs passed or were skipped."
