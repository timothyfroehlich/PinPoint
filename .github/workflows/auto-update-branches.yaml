# Auto-update branches: keep the next PR Tim has said to merge up to date with
# main (PP-zxlq.8, PP-zxlq.10).
#
# The ruleset (6326455) requires a branch to be up to date with main before it
# merges, so armed PRs land one at a time: each merge puts every other PR behind.
# After every push to main, this merges main into the first open, non-draft PR
# from this repository that has auto-merge armed and can take it, through the
# update-branch API. Only one PR is updated per push: updating all of them would
# run CI on every armed PR after every merge, about N squared runs for N PRs, and
# all but one of those runs is thrown away by the next merge. The PR that lands
# triggers the next run of this workflow, which updates the next PR.
#
# Order: the PR whose auto-merge was armed earliest goes first. A PR is skipped,
# and the next one tried, when it conflicts with main or when a required check
# already failed on its current head, so one stuck PR cannot stall the line. A
# PR that is already up to date is the head of the line: nothing behind it is
# touched until it merges. CI, Claude Review and UI Approval then run on the
# updated head as on any push, and GitHub merges it once they pass. A clean merge
# of main passes Claude Review and UI Approval without a new review or sign-off.
#
# PRs without auto-merge armed are never touched: their sessions are still
# working, and an update would only make them pull before their next push. A
# skipped PR is listed in the job summary with the reason; its owning session
# fixes it (merges main in and resolves the conflict, or fixes the failing
# check). Bot PRs (Dependabot, Renovate) are excluded: a commit pushed by anyone
# else makes the bot stop rebasing its PR, and a lockfile PR needs the bot's
# regenerated lockfile (`@dependabot rebase`), not a textual merge
# (pinpoint-pr-workflow Phase 4).
#
# A required check that fails after the update, with no later push to main, does
# not start this workflow. Run it by hand (workflow_dispatch) to move the line.
#
# Tokens: reads (PR list, check results, compare) use GITHUB_TOKEN. The update
# itself uses an installation token of Tim's GitHub App, because a commit made
# with GITHUB_TOKEN starts no workflows, so the updated PR would never get its
# required checks. The App (variable AUTO_UPDATE_APP_CLIENT_ID, secret
# AUTO_UPDATE_APP_PRIVATE_KEY) needs Contents, Pull requests and Workflows write;
# Workflows because main's new commits can include workflow files. It is not a
# ruleset bypass actor, so it cannot skip a gate. The job is skipped until the
# variable is set.

name: Auto-update branches

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  # A newer push to main supersedes a run in progress; the next run finds every
  # PR that is still behind.
  group: auto-update-branches
  cancel-in-progress: true

jobs:
  update:
    name: Update PRs set to merge
    if: vars.AUTO_UPDATE_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # ratchet:step-security/harden-runner@v2.22.2
        with:
          egress-policy: audit

      - name: Create an App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # ratchet:actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.AUTO_UPDATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTO_UPDATE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Merge main into the first PR set to merge
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # The ruleset's required checks decide which failures count. If they
          # cannot be read, no PR is skipped for a failed check.
          required=$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/main" \
            --jq '[.[] | select(.type == "required_status_checks")
                   | .parameters.required_status_checks[].context]') || required="[]"
          [[ "$required" != "[]" ]] || echo "::warning::could not read the required checks; failed checks do not skip a PR"
          # Armed PRs, oldest arming first: number, head, mergeable, count of
          # required checks that failed on that head.
          prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --state open --limit 100 \
            --json number,author,isDraft,isCrossRepository,autoMergeRequest,headRefOid,mergeable,statusCheckRollup \
            | jq -r --argjson required "$required" '
                [.[] | select(.autoMergeRequest != null and (.isDraft | not)
                              and (.isCrossRepository | not) and (.author.is_bot | not))]
                | sort_by(.autoMergeRequest.enabledAt) | .[]
                | [.number, .headRefOid, .mergeable,
                   ([.statusCheckRollup[]?
                     | select((.name // .context) as $n | any($required[]; . == $n))
                     | select((.conclusion // .state // "")
                              | IN("FAILURE", "TIMED_OUT", "STARTUP_FAILURE", "ERROR"))]
                    | length)]
                | @tsv')
          {
            echo "## PRs set to merge, oldest first"
            [[ -n "$prs" ]] || echo "None."
          } >> "$GITHUB_STEP_SUMMARY"
          lead=""
          while IFS=$'\t' read -r number head mergeable failed; do
            [[ -n "$number" ]] || continue
            if [[ -n "$lead" ]]; then
              line="#$number: waiting behind #$lead"
            elif [[ "$failed" != 0 ]]; then
              line="#$number: skipped: a required check failed on its current head"
              echo "::warning::$line"
            elif [[ "$mergeable" == CONFLICTING ]]; then
              line="#$number: skipped: conflicts with main"
              echo "::warning::$line"
            elif ! behind=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$head" --jq .behind_by); then
              line="#$number: skipped: could not compare with main"
              echo "::warning::$line"
            elif [[ "$behind" == 0 ]]; then
              lead="$number"
              line="#$number: up to date, first in line"
            elif err=$(GH_TOKEN="$APP_TOKEN" gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$number/update-branch" \
                -f expected_head_sha="$head" 2>&1 > /dev/null); then
              lead="$number"
              line="#$number: merged main in ($behind commits behind)"
            else
              # GitHub's message tells a conflict apart from a missing permission
              # or a rate limit; only a conflict is the owning session's to fix.
              line="#$number: skipped: not updated: ${err//$'\n'/ }"
              echo "::warning::$line"
            fi
            echo "- $line" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$prs"
