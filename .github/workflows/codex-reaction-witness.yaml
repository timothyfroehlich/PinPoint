# Convert Codex's commit-less clean-review reaction into exact-head evidence.
#
# Security boundary: both events load this workflow and its checked-out helper from
# trusted main, never from the PR branch. Manual fallback comments are accepted only
# from the repository owner and must carry the documented SHA marker. The helper
# witnesses a fresh eyes -> +1 transition while continuously verifying that the marked
# PR head is unchanged, then posts a github-actions comment pinned to that SHA.

name: Codex Reaction Witness

on:
  # Required so the workflow and helper come from trusted main. The job rejects forks,
  # checks out only the default branch, and never evaluates or executes PR-controlled data.
  pull_request_target:  # zizmor: ignore[dangerous-triggers]
    types: [opened, ready_for_review, synchronize, reopened]
  # A manual fallback happens only after the automatic witness has exited. Starting a
  # new trusted-main run here lets a reaction-only fallback produce SHA-pinned evidence.
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: codex-reaction-witness-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  witness:
    name: Witness clean Codex review
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       github.event.comment.user.login == github.repository_owner &&
       startsWith(github.event.comment.body, '@codex review'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      TRIGGERED_AT: ${{ github.event.pull_request.updated_at || github.event.comment.created_at }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # ratchet:step-security/harden-runner@v2.20.1
        with:
          egress-policy: audit

      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # ratchet:actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Witness reaction transition
        run: |
          expected_head="$EXPECTED_HEAD"
          if [[ "$EVENT_NAME" == "issue_comment" ]]; then
            if ! expected_head=$(jq -er '
              .comment.body
              | capture("^@codex review\\n<!-- pinpoint-codex-review-head: (?<head>[0-9a-f]{40}) -->$")
              | .head
            ' "$GITHUB_EVENT_PATH"); then
              echo "Manual witness requires the exact SHA-bound review command."
              exit 0
            fi
            pr_json=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
            if ! jq -e --arg repo "$GITHUB_REPOSITORY" --arg head "$expected_head" \
              '.head.repo.full_name == $repo and .draft == false and .head.sha == $head' \
              <<< "$pr_json" >/dev/null; then
              echo "Manual witness requires the marked SHA to remain head on a ready pull request from this repository."
              exit 0
            fi
          fi
          bash scripts/workflow/codex-reaction-witness.sh \
            "$PR_NUMBER" "$expected_head" "$TRIGGERED_AT"
