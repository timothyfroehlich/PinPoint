name: Setup Playwright browsers
description: >-
  Restore the Playwright browsers from the cache keyed on the installed
  Playwright version, installing them on a miss. Run after node_modules is in
  place.

inputs:
  browsers:
    description: Space-separated browsers to install on a cache miss (for example "chromium webkit").
    required: true
  save-cache:
    description: >-
      "true" saves the cache after the job. Only main's comprehensive E2E job
      saves, because a PR can read main's caches but not another PR's: every PR
      job restores that one chromium+webkit cache instead of keeping its own.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Resolve Playwright version
      id: version
      shell: bash
      run: |
        set -euo pipefail
        version=$(pnpm exec playwright --version | awk '{print $2}')
        if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
          echo "::error::could not resolve the Playwright version (got '$version')"
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    # No restore-keys: a prefix match would carry every earlier browser
    # revision forward into each new save. A Playwright bump pays one cold
    # download on main, then every job hits the new key.
    - name: Cache Playwright browsers
      id: cache-save
      if: inputs.save-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # ratchet:actions/cache@v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-all-${{ steps.version.outputs.version }}

    - name: Restore Playwright browsers
      id: cache-restore
      if: inputs.save-cache != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # ratchet:actions/cache/restore@v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-all-${{ steps.version.outputs.version }}

    - name: Install Playwright browsers
      if: steps.cache-save.outputs.cache-hit != 'true' && steps.cache-restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: |
        # shellcheck disable=SC2086  # word-split the browser list on purpose
        pnpm exec playwright install --with-deps $BROWSERS
