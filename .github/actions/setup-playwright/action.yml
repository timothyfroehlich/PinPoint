name: Setup Playwright browsers
description: >-
  Restore the Playwright browsers from the cache keyed on the installed
  Playwright version, installing them on a miss. Run after node_modules is in
  place.

inputs:
  browsers:
    description: Space-separated browsers to install on a cache miss (for example "chromium webkit").
    required: true
  with-deps:
    description: >-
      "true" also installs the browsers' apt packages on a cache miss. Pass
      "false" when the job installs system dependencies itself.
    required: false
    default: "true"
  save-cache:
    description: >-
      "true" saves the cache after the job. Only main's comprehensive E2E job
      saves, because a PR can read main's caches but not another PR's: every PR
      job restores that one chromium+webkit cache instead of keeping its own.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Resolve Playwright version
      id: version
      shell: bash
      run: |
        set -euo pipefail
        version=$(pnpm exec playwright --version | awk '{print $2}')
        if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
          echo "::error::could not resolve the Playwright version (got '$version')"
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    # No restore-keys: a prefix match would carry every earlier browser
    # revision forward into each new save. The PR that bumps Playwright
    # installs in every shard on every push (PR jobs never save); after it
    # merges, main's first run saves the new key and every job hits it.
    - name: Restore Playwright browsers
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # ratchet:actions/cache/restore@v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-${{ runner.arch }}-playwright-all-${{ steps.version.outputs.version }}

    # Runs on a hit too: `playwright install` skips browsers already on disk,
    # so a hit costs seconds, and a cache saved without one of the requested
    # browsers still gets it. System packages only on a miss, as before.
    - name: Install Playwright browsers
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
        WITH_DEPS: ${{ inputs.with-deps }}
        CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
      run: |
        flags=()
        if [ "$WITH_DEPS" = "true" ] && [ "$CACHE_HIT" != "true" ]; then flags+=(--with-deps); fi
        # shellcheck disable=SC2086  # word-split the browser list on purpose
        pnpm exec playwright install "${flags[@]}" $BROWSERS

    # Saved right after the install, not in actions/cache's post step: that
    # step only runs when the whole job succeeds, so a red main would leave
    # every PR without the cache until main went green again.
    - name: Save Playwright browsers
      if: inputs.save-cache == 'true' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # ratchet:actions/cache/save@v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.restore.outputs.cache-primary-key }}
