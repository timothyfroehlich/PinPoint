name: Setup Supabase
description: >-
  Start local Supabase with retry, export env vars via jq,
  and optionally seed the database for CI tests.

inputs:
  seed:
    description: Run migrations + seed after starting (set to 'false' for migration-only jobs)
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Generate config.toml from template
      shell: bash
      run: cp supabase/config.toml.template supabase/config.toml

    - name: Reserve Supabase ports (fail-safe backstop)
      shell: bash
      run: |
        # The PRIMARY reservation is ./.github/actions/reserve-supabase-ports,
        # run as a job's first step so it beats `pnpm install`'s npm-registry
        # traffic — the biggest source of 543xx-range steals (PP-3w32.2). A
        # reservation here cannot win that race, because this action runs after
        # install. So this step is NOT the primary fix and does not replace the
        # hoisted one.
        #
        # It is a fail-safe backstop that keeps this action self-contained: if a
        # future job adds `setup-supabase` but forgets the hoisted first step,
        # this still reserves the block before `supabase start`, shielding its
        # own docker-pull steals — so the action never silently regresses to
        # worse than pre-PP-3w32.2. When the hoisted step already ran (every
        # current caller), 54320-54329 is present and this is a no-op skip.
        #
        # Signature `supabase-port-bind`, docs/runbooks/gha-flake-log.md.
        reserved=$(cat /proc/sys/net/ipv4/ip_local_reserved_ports 2>/dev/null || echo "")
        case ",${reserved}," in
          *,54320-54329,* | *"54320-54329"*)
            echo "::notice::54320-54329 already reserved — hoisted reserve-supabase-ports ran; skipping backstop"
            ;;
          *)
            want=54320-54329
            [ -n "${reserved}" ] && want="${reserved},54320-54329"
            if sudo sysctl -w "net.ipv4.ip_local_reserved_ports=${want}" >/dev/null 2>&1; then
              echo "::warning::reserved 54320-54329 as a backstop — hoisted reserve-supabase-ports did not run for this job"
            else
              echo "::warning::could not reserve 54320-54329; supabase start may lose a port race"
            fi
            ;;
        esac

    - name: Start Supabase (with retry)
      shell: bash
      run: |
        exclude="studio,realtime,storage-api,edge-runtime,logflare,vector,imgproxy,supavisor,postgres-meta"
        for attempt in 1 2 3; do
          if supabase start -x "$exclude"; then
            echo "::notice::Supabase started successfully (attempt $attempt/3)"
            exit 0
          fi
          echo "::warning::supabase start failed (attempt $attempt/3)"

          # Capture who holds the port BEFORE tearing anything down, so the next
          # sighting diagnoses itself instead of costing another triage session.
          # A socket with no owning container points at an ephemeral-port steal;
          # a lingering docker-proxy or container points at a Docker host-port race.
          echo "::group::port diagnostics (attempt $attempt/3)"
          sudo ss -tanp 2>/dev/null | grep -E ':543[0-9]{2}\b' || echo "no sockets in 54300-54399"
          docker ps -a --format '{{.Names}}\t{{.Status}}\t{{.Ports}}' 2>/dev/null || true
          echo "::endgroup::"

          supabase stop --no-backup 2>/dev/null || true
          docker rm -f $(docker ps -aq --filter "label=com.supabase.cli.project=pinpoint") 2>/dev/null || true
          sleep 10
        done
        echo "::error::supabase start failed after 3 attempts"
        exit 1

    - name: Export Supabase env vars
      shell: bash
      run: |
        env_lines=$(supabase status --output json | jq -r '
          "NEXT_PUBLIC_SUPABASE_URL="              + (.API_URL | gsub("127\\.0\\.0\\.1";"localhost")),
          "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="  + .ANON_KEY,
          "SUPABASE_SERVICE_ROLE_KEY="             + .SERVICE_ROLE_KEY,
          "POSTGRES_URL="                          + (.DB_URL | gsub("127\\.0\\.0\\.1";"localhost")),
          "POSTGRES_URL_NON_POOLING="              + (.DB_URL | gsub("127\\.0\\.0\\.1";"localhost")),
          "NEXT_PUBLIC_SITE_URL=http://localhost:3000",
          "PORT=3000",
          "MAILPIT_PORT="  + (.INBUCKET_URL | split(":") | last),
          "INBUCKET_PORT=" + (.INBUCKET_URL | split(":") | last)
        ')

        # SMTP port is not in status output — read from config.toml
        smtp_port=$(grep smtp_port supabase/config.toml | grep -oE '[0-9]+')
        env_lines+=$'\n'"MAILPIT_SMTP_PORT=${smtp_port}"
        env_lines+=$'\n'"INBUCKET_SMTP_PORT=${smtp_port}"
        env_lines+=$'\n'"EMAIL_TRANSPORT=smtp"

        # Discord OAuth — dummy values so providers.discord.isAvailable()
        # returns true and the Connected Accounts row + login button render
        # in CI. The OAuth flow itself isn't exercised; tests bypass it via
        # direct DB writes (setUserDiscordId).
        env_lines+=$'\n'"DISCORD_CLIENT_ID=ci_dummy_discord_client_id"
        env_lines+=$'\n'"DISCORD_CLIENT_SECRET=ci_dummy_discord_client_secret"

        # Write to $GITHUB_ENV (available to subsequent workflow steps)
        echo "$env_lines" >> "$GITHUB_ENV"

        # Write .env.local — required by npm scripts using `node --env-file=.env.local`
        echo "$env_lines" > .env.local

    - name: Initialize database
      if: inputs.seed == 'true'
      shell: bash
      run: |
        pnpm run db:migrate
        pnpm run test:_generate-schema
        pnpm run db:_seed
        pnpm run db:_seed-users
