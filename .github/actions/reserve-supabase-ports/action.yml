name: Reserve Supabase ports
description: >-
  Reserve Supabase's host port block (54320-54329) from the Linux ephemeral
  range before anything on the runner opens outbound connections. Must run as
  an early job step — after checkout but before dependency install — so that
  pnpm/npm registry traffic cannot be handed one of those ports as an ephemeral
  source port and hold it in TIME_WAIT past the point `supabase start` needs it.
  Fails open.

runs:
  using: composite
  steps:
    - name: Reserve Supabase ports from the ephemeral range
      shell: bash
      run: |
        # Supabase binds 54320-54329 (see supabase/config.toml.template). Linux
        # allocates ephemeral source ports from ip_local_port_range, whose default
        # (32768-60999) contains that whole block. So an ordinary outbound
        # connection — the many short-lived registry connections `pnpm install`
        # makes, for one — can be handed 54322 as its source port, and the
        # subsequent bind() of the published host port then fails with "address
        # already in use". A socket in TIME_WAIT holds the port for 60s, which
        # outlives all three of setup-supabase's start retries, so the retry loop
        # cannot recover from this.
        #
        # This step is deliberately hoisted to run BEFORE dependency install
        # (unlike the earlier placement inside the setup-supabase composite, which
        # ran after install and so lost the race — PP-3w32.2). It reads no repo
        # files, so it only needs to follow checkout for the composite action
        # itself to be present on disk.
        #
        # ip_local_reserved_ports excludes the block from automatic allocation:
        # "Specify the ports which are reserved for known third-party
        # applications. These ports will not be used by automatic port
        # allocations." — Documentation/networking/ip-sysctl.rst
        #
        # Fails open: a runner that won't take the sysctl still starts Supabase.
        # Signature `supabase-port-bind`, docs/runbooks/gha-flake-log.md.
        range=$(cat /proc/sys/net/ipv4/ip_local_port_range 2>/dev/null || echo unknown)
        echo "::notice::ip_local_port_range=${range} — Supabase needs 54320-54329"

        want=54320-54329
        reserved=$(cat /proc/sys/net/ipv4/ip_local_reserved_ports 2>/dev/null || echo "")
        if [ -n "$reserved" ]; then
          want="${reserved},${want}"
        fi

        if sudo sysctl -w "net.ipv4.ip_local_reserved_ports=${want}" >/dev/null 2>&1; then
          echo "::notice::ip_local_reserved_ports=$(cat /proc/sys/net/ipv4/ip_local_reserved_ports)"
        else
          echo "::warning::could not reserve 54320-54329; supabase start may lose a port race"
        fi
